<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>觀卜 Guanbu — Divination App</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+TC:wght@500;700&family=EB+Garamond:ital@0;1&display=swap');

  :root{
    --bg:#0B0B14;
    --panel:#15141F;
    --panel-border:#2A2438;
    --text:#EDE6D6;
    --sub:#8A8398;
    --gold:#C9A227;
    --crimson:#8B2635;
    --jade:#3F6659;
    --runic:#5C7A99;
    --violet:#6B4E8E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:'EB Garamond', serif; min-height:100%;}
  body{
    background-image:
      radial-gradient(circle at 20% 0%, rgba(201,162,39,0.06), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(92,122,153,0.06), transparent 45%);
  }
  .app{max-width:460px;margin:0 auto;min-height:100vh;padding:16px 18px 60px;}

  .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .lang-btn{background:#1B1A26;border:1px solid var(--gold);color:var(--gold);
    padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;font-family:'Noto Serif TC',serif;}

  .hero{text-align:center;margin-bottom:20px;}
  .hero .mark{font-size:12px;letter-spacing:.35em;color:var(--sub);margin-bottom:4px;}
  .hero h1{font-family:'Noto Serif TC',serif;font-weight:700;font-size:28px;margin:0;
    background:linear-gradient(120deg, var(--gold), #E8D48A 55%, var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero p{color:var(--sub);font-size:13px;margin-top:6px;font-style:italic;}

  .tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
  .tab{flex:1;min-width:55px;padding:9px 2px;text-align:center;border-radius:10px;
    border:1px solid var(--panel-border);background:var(--panel);
    color:var(--sub);font-family:'Noto Serif TC',serif;font-size:13px;font-weight:700;
    cursor:pointer;transition:border-color .2s, color .2s;}
  .tab.active{color:var(--text);}
  .tab[data-t="yijing"].active{border-color:var(--jade);box-shadow:0 0 0 1px var(--jade) inset;}
  .tab[data-t="tarot"].active{border-color:var(--crimson);box-shadow:0 0 0 1px var(--crimson) inset;}
  .tab[data-t="runes"].active{border-color:var(--runic);box-shadow:0 0 0 1px var(--runic) inset;}
  .tab[data-t="daily"].active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}
  .tab[data-t="ziwei"].active{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet) inset;}

  .panel{display:none;background:var(--panel);border:1px solid var(--panel-border);
    border-radius:16px;padding:20px 16px;min-height:280px;}
  .panel.active{display:block;}

  .section-title{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.18em;
    color:var(--sub);margin-bottom:14px;text-align:center;}
  .section-title.cn{font-family:'Noto Serif TC',serif;letter-spacing:.08em;}

  .btn{display:block;width:100%;padding:12px;border-radius:10px;border:none;
    font-family:'Noto Serif TC',serif;font-weight:700;font-size:15px;cursor:pointer;
    margin-top:14px;transition:transform .15s;}
  .btn:active{transform:scale(0.98);}
  .btn.jade{background:var(--jade);color:#EAF3EF;}
  .btn.crimson{background:var(--crimson);color:#F6E9EA;}
  .btn.runic{background:var(--runic);color:#EAF1F7;}
  .btn.gold{background:var(--gold);color:#1B1508;}

  .field{margin:10px 0 14px;}
  .field label{display:block;color:var(--sub);font-family:'Noto Serif TC',serif;font-size:12px;margin-bottom:6px;}
  .input,.select{width:100%;background:#0F0E17;color:var(--text);border:1px solid var(--panel-border);
    border-radius:10px;padding:10px 12px;font-size:14px;outline:none;}
  .input:focus,.select:focus{border-color:var(--gold);}
  .mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .meta-card{margin:12px 0;padding:12px;border:1px solid var(--panel-border);border-radius:12px;background:#11101A;}
  .meta-row{display:flex;justify-content:space-between;gap:12px;padding:4px 0;color:var(--sub);font-size:13px;}
  .meta-row strong{color:var(--text);font-weight:600;text-align:right;}
  .moving{color:var(--gold);}
  .question-echo{font-family:'Noto Serif TC',serif;text-align:center;color:#D9CFB7;font-size:14px;line-height:1.6;margin:8px 0 14px;}
  .toolbar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .btn.secondary{background:#211F2B;color:var(--sub);border:1px solid var(--panel-border);}
  .btn.small{padding:8px 10px;margin-top:0;font-size:12px;}
  @media (max-width:380px){.mini-grid{grid-template-columns:1fr;}}

  .smart-card{margin:14px 0;padding:14px;border:1px solid rgba(201,162,39,.35);border-radius:14px;background:linear-gradient(160deg,#171520,#111019);}
  .smart-title{font-family:'Noto Serif TC',serif;font-size:13px;color:var(--gold);letter-spacing:.08em;margin-bottom:8px;}
  .smart-text{font-size:14px;line-height:1.7;color:var(--text);}
  
  .empty{color:var(--sub);text-align:center;font-size:14px;padding:36px 10px;line-height:1.8;}
  .footer-note{text-align:center;color:var(--sub);font-size:11px;margin-top:24px;}
</style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <div></div>
    <button class="lang-btn" id="lang-toggle">中文 / EN / ID</button>
  </div>

  <div class="hero">
    <div class="mark">D I V I N A T I O N</div>
    <h1>觀卜</h1>
    <p i18n="subtitle">易經 · 塔羅 · 盧恩 · 每日運勢 · 紫微斗數</p>
  </div>

  <div class="tabs">
    <div class="tab active" data-t="yijing" i18n="tab_yijing">易經</div>
    <div class="tab" data-t="tarot" i18n="tab_tarot">塔羅</div>
    <div class="tab" data-t="runes" i18n="tab_runes">符文</div>
    <div class="tab" data-t="daily" i18n="tab_daily">每日</div>
    <div class="tab" data-t="ziwei" i18n="tab_ziwei">紫微</div>
  </div>

  <!-- Yijing Panel -->
  <div class="panel active" id="panel-yijing">
    <div class="section-title cn" i18n="title_yijing">起卦問事</div>
    <div class="field">
      <label i18n="lbl_question">你想問什麼？</label>
      <input class="input" id="yijing-question" maxlength="120" placeholder="例：2027 年工作是否會有重大轉變？" i18n-ph="ph_yijing" />
    </div>
    <div id="yijing-result"><div class="empty" i18n="empty_yijing">心中默想欲問之事<br/>按下起卦，以三枚銅錢法擲出六爻</div></div>
    <button class="btn jade" id="yijing-btn" i18n="btn_yijing">起卦</button>
  </div>

  <!-- Tarot Panel -->
  <div class="panel" id="panel-tarot">
    <div class="section-title">MAJOR ARCANA</div>
    <div class="field"><label i18n="lbl_question_opt">問題（可留白）</label><input class="input" id="tarot-question" maxlength="120" placeholder="例：這件事接下來三個月的發展？" i18n-ph="ph_tarot" /></div>
    <div class="field"><label i18n="lbl_spread">牌陣</label><select class="select" id="tarot-mode"><option value="1" i18n="opt_t1">單張指引</option><option value="3" i18n="opt_t3">三張牌｜過去・現在・未來</option></select></div>
    <div id="tarot-result"><div class="empty" i18n="empty_tarot">靜心片刻<br/>抽牌看看此刻該留意什麼</div></div>
    <button class="btn crimson" id="tarot-btn" i18n="btn_tarot">抽牌</button>
  </div>

  <!-- Runes Panel -->
  <div class="panel" id="panel-runes">
    <div class="section-title">ELDER FUTHARK</div>
    <div class="field"><label i18n="lbl_question_opt">問題（可留白）</label><input class="input" id="runes-question" maxlength="120" placeholder="例：我現在最需要注意什麼？" i18n-ph="ph_runes" /></div>
    <div class="field"><label i18n="lbl_spread">符文陣</label><select class="select" id="runes-mode"><option value="1" i18n="opt_r1">單枚指引</option><option value="3" i18n="opt_r3">三枚｜現況・阻力・建議</option></select></div>
    <div id="runes-result"><div class="empty" i18n="empty_runes">伸手入符文袋中<br/>抽出符文，聆聽它的訊息</div></div>
    <button class="btn runic" id="runes-btn" i18n="btn_runes">抽符文</button>
  </div>

  <!-- Daily Panel -->
  <div class="panel" id="panel-daily">
    <div class="section-title cn" i18n="title_daily">今日運勢</div>
    <div class="field"><label i18n="lbl_birth">生日（選填）</label><input class="input" type="date" id="daily-birth" /></div>
    <div id="daily-result"><div class="empty" i18n="empty_daily">按下查看，抓出今天的運勢</div></div>
    <button class="btn gold" id="daily-btn" i18n="btn_daily">查看今日運勢</button>
  </div>

  <!-- Ziwei Panel -->
  <div class="panel" id="panel-ziwei">
    <div class="section-title cn" i18n="title_ziwei">紫微斗數排盤</div>
    <div class="field"><label i18n="lbl_dob">出生日期（國曆）</label><input class="input" type="date" id="zw-date" /></div>
    <div class="mini-grid">
      <div class="field"><label i18n="lbl_tob">出生時間</label><input class="input" type="time" id="zw-hour" /></div>
      <div class="field"><label i18n="lbl_gender">性別</label>
        <select class="select" id="zw-gender"><option value="M" i18n="opt_male">男</option><option value="F" i18n="opt_female">女</option></select>
      </div>
    </div>
    <div id="ziwei-result"><div class="empty" i18n="empty_ziwei">輸入出生資料<br/>按下排盤，起出你的十二宮命盤</div></div>
    <button class="btn" id="ziwei-btn" style="background:var(--violet);color:#F3EAF9;" i18n="btn_ziwei">排盤</button>
  </div>

  <div class="footer-note" i18n="footer">僅供參考娛樂｜v2.3｜重要決策仍以現實資訊為準</div>
</div>

};

function applyLang(lang) {
  currentLang = lang;
  localStorage.setItem('guanbu_lang', lang);
  document.getElementById('lang-toggle').innerText = dict[lang].btn_lang;
  
  document.querySelectorAll('[i18n]').forEach(el => {
    const key = el.getAttribute('i18n');
    if (dict[lang][key]) el.innerHTML = dict[lang][key];
  });
  document.querySelectorAll('[i18n-ph]').forEach(el => {
    const key = el.getAttribute('i18n-ph');
    if (dict[lang][key]) el.placeholder = dict[lang][key];
  });
}

document.getElementById('lang-toggle').onclick = () => {
  const nextIdx = (languages.indexOf(currentLang) + 1) % languages.length;
  applyLang(languages[nextIdx]);
};

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('panel-'+t.dataset.t).classList.add('active');
  });
});

function esc(s){
  return String(s||'').replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

// ---------------- AI Functions ----------------
let aiCardSeq = 0;
function aiCardPlaceholder(title) {
  const id = `ai-card-${Date.now()}-${aiCardSeq++}`;
  const hints = dict[currentLang].hints;
  const hint = hints[Math.floor(Math.random() * hints.length)];
  return {
    id,
    html: `<div class="smart-card" id="${id}"><div class="smart-title">${esc(title)}</div><div class="smart-text" style="color:var(--sub);font-style:italic;">${hint}</div></div>`,
  };
}

async function fillAiExplain(id, module, question, facts) {
  const el = document.getElementById(id);
  if (!el) return;
  try {
    const res = await fetch('/ask', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ module, question: question || '', facts, lang: currentLang }),
    });
    const data = await res.json().catch(() => null);
    if (!res.ok || !data?.ok) throw new Error(data?.error || `HTTP ${res.status}`);
    el.innerHTML = `<div class="smart-title">${dict[currentLang].ai_title}</div><div class="smart-text">${esc(data.explanation).replace(/\n+/g,'<br/>')}</div>`;
  } catch (e) {
    el.innerHTML = `<div class="smart-title">${dict[currentLang].ai_title}</div><div class="smart-text" style="color:var(--sub);">Failed: ${esc(e.message)}</div>`;
  }
}

function attachChatSection(containerId, moduleName, question, facts) {
  const container = document.getElementById(containerId);
  if (!container) return;

  const chatBoxId = `chat-box-${Date.now()}`;
  const inputId = `chat-input-${Date.now()}`;
  const history = [];

  const chatHTML = `
    <div class="smart-card" style="border-color:rgba(92,122,153,0.4);">
      <div class="smart-title" style="color:var(--runic);">${dict[currentLang].ai_chat_title}</div>
      <div class="toolbar" style="margin-bottom:10px;">
        <button class="btn secondary small" id="${chatBoxId}-q1">${dict[currentLang].chat_q1}</button>
        <button class="btn secondary small" id="${chatBoxId}-q2">${dict[currentLang].chat_q2}</button>
      </div>
      <div id="${chatBoxId}-history" style="margin-bottom:10px; display:flex; flex-direction:column; gap:8px;"></div>
      <div style="display:flex; gap:6px;">
        <input class="input" id="${inputId}" placeholder="${dict[currentLang].chat_ph}" style="font-size:13px;" />
        <button class="btn gold small" id="${chatBoxId}-send" style="width:auto; white-space:nowrap;">${dict[currentLang].chat_send}</button>
      </div>
    </div>
  `;
  container.insertAdjacentHTML('beforeend', chatHTML);

  const sendMsg = async (msgText) => {
    if (!msgText) return;
    const historyEl = document.getElementById(`${chatBoxId}-history`);
    historyEl.insertAdjacentHTML('beforeend', `<div style="color:var(--gold); font-size:13px;"><strong>You:</strong> ${esc(msgText)}</div>`);
    historyEl.insertAdjacentHTML('beforeend', `<div id="${chatBoxId}-temp" style="color:var(--sub); font-size:13px; font-style:italic;">AI thinking...</div>`);

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ module: moduleName, question, facts, history, message: msgText, lang: currentLang })
      });
      const data = await res.json().catch(() => null);
      document.getElementById(`${chatBoxId}-temp`)?.remove();
      if (res.ok && data?.ok) {

function tossLine(){
  let sum=0;
  for(let i=0;i<3;i++) sum += Math.random()<0.5?2:3;
  return sum;
}
function trigramIndex(bits){
  const key = bits.join('');
  const map = {"111":0,"110":1,"101":2,"100":3,"011":4,"010":5,"001":6,"000":7};
  return map[key];
}

function timingFromRunes(picks){
  let score=0;
  picks.forEach((idx,i)=>{ const v=RUNES_AI[idx]; score += v.pace*(i===picks.length-1?1.25:1); });
  if(score>=3) return '近期｜數週到約 1–3 個月的節奏';
  if(score<=-2.2) return '偏慢｜數月級，先整理條件再看進展';
  return '中期｜較像數月內逐步推進，不像立即定局';
}

function runeAnswer(picks,q){
  const tags=classifyQuestion(q), intent=analyzeIntent(q);
  const vs=picks.map(idx=>RUNES_AI[idx]);
  const weights=picks.length===3?[0.8,0.6,1.1]:[1.2];
  let score=0, agency=0;
  vs.forEach((v,i)=>{score+=v.tone*weights[i]; agency+=v.agency*weights[i];});
  const signs=vs.map(v=>Math.sign(v.tone)).filter(Boolean);
  const same=signs.length>1 && signs.every(s=>s===signs[0]);
  let confidence=46+(same?20:0)+Math.min(18,Math.abs(score)*5);
  if(picks.length===3 && vs[1].tone<0 && vs[2].tone>0) confidence+=6;
  confidence=Math.round(Math.max(28,Math.min(90,confidence)));
  let direction=score>=2?'偏往好的':score<=-2?'比較卡':'還不一定';
  let window=timingFromRunes(picks);
  const lead=humanLead(intent,direction);
  const paceH=softenPace(window);
  const tipIdx=picks.length===3?picks[2]:picks[0];
  const tipName=RUNES[tipIdx][1];
  const tipText=RUNES[tipIdx][2];
  let answer='';
  if(intent.type==='when'){
    answer = score>1 ? `${lead}有機會往前，但不是立刻。${paceH}「${tipName}」：${tipText}` :
             score<-1 ? `${lead}時間可能往後拖。先把卡住的清一清。${paceH}` :
             `${lead}說不出正確日期，邊走邊看。${paceH}`;
  }else if(intent.type==='yesno'){
    const lean = score>=0.6 ? 'yes' : score<=-0.6 ? 'no' : (score>=0?'yes':'no');

             score<=-2 ? `${lead}整體偏卡，先處理根上的問題。「${tipName}」：${tipText}` :

    reasons.push(`建議符文偏${vs[2].tone>0?'可行推進':'保守收斂'}，步調屬${vs[2].pace>0?'推進型':vs[2].pace<0?'放緩型':'中性'}。`);

  }

  const hr3=horizonReason(intent); if(hr3) reasons.push(hr3);
  return {tags,intent,answer,direction,window,confidence,clarity:confidenceLabel(confidence),reasons};
}

  const d = new Date();
  const key = `${d.getFullYear()}${d.getMonth()}${d.getDate()}|${extra}`;
  let h = 0;
  for(let i=0;i<key.length;i++){ h = (h*31 + key.charCodeAt(i)) >>> 0; }

}

  return function(){

    return s / 233280;

// ==================== 紫微斗數引擎 ====================
function toJD(y, m, d, hour) {
  hour = hour || 0;
  if (m <= 2) { y -= 1; m += 12; }
  const A = Math.floor(y / 100);
  const B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + hour/24 + B - 1524.5;
}

function normDeg(x) { x = x % 360; return x < 0 ? x + 360 : x; }
const D2R = Math.PI / 180;

function sunLongitude(jd) {
  const T = (jd - 2451545.0) / 36525;
  const L0 = normDeg(280.46646 + 36000.76983 * T + 0.0003032 * T * T);
  const M = normDeg(357.52911 + 35999.05029 * T - 0.0001537 * T * T);
  const Mr = M * D2R;
  const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(Mr)
          + (0.019993 - 0.000101 * T) * Math.sin(2 * Mr)
          + 0.000289 * Math.sin(3 * Mr);
  const trueLong = L0 + C;
  const omega = 357.52911 <= 0 ? 0 : normDeg(125.04 - 1934.136 * T);
  return normDeg(trueLong - 0.00569 - 0.00478 * Math.sin(omega * D2R));
}

function moonLongitude(jd) {
  const T = (jd - 2451545.0) / 36525;
  const Lp = normDeg(218.3164477 + 481267.88123421 * T - 0.0015786 * T*T + T*T*T/538841 - T*T*T*T/65194000);
  const D  = normDeg(297.8501921 + 445267.1114034 * T - 0.0018819 * T*T + T*T*T/545868 - T*T*T*T/113065000);
  const M  = normDeg(357.5291092 + 35999.0502909 * T - 0.0001536 * T*T + T*T*T/24490000);
  const Mp = normDeg(134.9633964 + 477198.8675055 * T + 0.0087414 * T*T + T*T*T/69699 - T*T*T*T/14712000);
  const F  = normDeg(93.2720950 + 483202.0175233 * T - 0.0036539 * T*T - T*T*T/3526000 + T*T*T*T/863310000);
  const r = D2R;
  let dl = 6.288774 * Math.sin(Mp*r)
    + 1.274027 * Math.sin((2*D - Mp)*r)
    + 0.658314 * Math.sin(2*D*r)
    + 0.213618 * Math.sin(2*Mp*r)
    - 0.185116 * Math.sin(M*r)
    - 0.114332 * Math.sin(2*F*r)
    + 0.058793 * Math.sin((2*D - 2*Mp)*r)
    + 0.057066 * Math.sin((2*D - M - Mp)*r)
    + 0.053322 * Math.sin((2*D + Mp)*r)
    + 0.045758 * Math.sin((2*D - M)*r)
    - 0.040923 * Math.sin((M - Mp)*r)
    - 0.034720 * Math.sin(D*r)
    - 0.030383 * Math.sin((M + Mp)*r)
    + 0.015327 * Math.sin((2*D - 2*F)*r)
    - 0.012528 * Math.sin((Mp + 2*F)*r)
    + 0.010980 * Math.sin((Mp - 2*F)*r)
    + 0.010675 * Math.sin((4*D - Mp)*r)
    + 0.010034 * Math.sin(3*Mp*r)
    + 0.008548 * Math.sin((4*D - 2*Mp)*r)
    - 0.007910 * Math.sin((M - Mp + 2*D)*r)
    - 0.006783 * Math.sin((2*D + M)*r);
  return normDeg(Lp + dl);
}

function elongation(jd) {
  return normDeg(moonLongitude(jd) - sunLongitude(jd));
}

function findNewMoonNear(jdGuess) {
  let jd = jdGuess;
  for (let i = 0; i < 30; i++) {
    let e = elongation(jd);
    if (e > 180) e -= 360;
    jd -= e / 12.190749;
    if (Math.abs(e) < 0.0005) break;
  }
  return jd;
}

function findNewMoonsInRange(jdFrom, jdTo) {
  const results = [];
  let k = Math.floor((jdFrom - 2451550.09766) / 29.530588861) - 2;
  while (true) {
    const guess = 2451550.09766 + 29.530588861 * k;
    if (guess > jdTo + 40) break;
    const nm = findNewMoonNear(guess);
    if (nm >= jdFrom - 40 && nm <= jdTo + 40) results.push(nm);
    k++;
  }
  results.sort((a, b) => a - b);
  const dedup = [];
  for (const v of results) {
    if (!dedup.length || v - dedup[dedup.length - 1] > 15) dedup.push(v);
  }
  return dedup;
}

function findSolarLongitudeJD(targetDeg, jdGuess) {
  let jd = jdGuess;
  for (let i = 0; i < 30; i++) {
    let diff = normDeg(sunLongitude(jd) - targetDeg);
    if (diff > 180) diff -= 360;
    jd -= diff / 0.9856;
    if (Math.abs(diff) < 0.0005) break;
  }
  return jd;
}

function localMidnightJD(jd) {
  const ms = (jd - 2440587.5) * 86400000;
  const twMs = ms + 8 * 3600 * 1000;
  const twDate = new Date(twMs);
  const y = twDate.getUTCFullYear(), m = twDate.getUTCMonth() + 1, d = twDate.getUTCDate();
  const localMidnightUTCms = Date.UTC(y, m - 1, d, 0, 0, 0) - 8 * 3600 * 1000;
  return localMidnightUTCms / 86400000 + 2440587.5;
}

function dongzhiJD(year) {
  const guess = toJD(year, 12, 22, -8);
  return findSolarLongitudeJD(270, guess);
}

function buildYearMonths(year) {
  const dz0 = dongzhiJD(year - 1);
  const dz1 = dongzhiJD(year);
  const newMoons = findNewMoonsInRange(dz0 - 20, dz1 + 40).map(localMidnightJD);
  let startIdx = 0;
  for (let i = 0; i < newMoons.length - 1; i++) {
    if (newMoons[i] <= dz0 && dz0 < newMoons[i+1]) { startIdx = i; break; }
  }
  let endIdx = newMoons.length - 1;
  for (let i = 0; i < newMoons.length - 1; i++) {
    if (newMoons[i] <= dz1 && dz1 < newMoons[i+1]) { endIdx = i; break; }
  }
  const monthCount = endIdx - startIdx;
  const hasLeap = monthCount === 13;

  function monthHasZhongqi(mStartJD, mEndJD) {
    for (let k = 0; k < 12; k++) {
      const targetDeg = normDeg(k * 30);
      const guess = (mStartJD + mEndJD) / 2;
      const zqJD = findSolarLongitudeJD(targetDeg, guess);
      if (zqJD >= mStartJD && zqJD < mEndJD) return true;
    }
    return false;
  }

  const months = [];
  let currentLabel = 11;
  let leapUsed = false;
  for (let i = startIdx; i < endIdx; i++) {
    const mStart = newMoons[i], mEnd = newMoons[i+1];
    let isLeap = false;
    if (i === startIdx) {
    } else if (hasLeap && !leapUsed && !monthHasZhongqi(mStart, mEnd)) {
      isLeap = true;
      leapUsed = true;
    } else {
      currentLabel = currentLabel === 12 ? 1 : currentLabel + 1;
    }
    months.push({ startJD: mStart, endJD: mEnd, monthNum: currentLabel, isLeap });
  }
  return months;
}

function solarToLunar(y, m, d, hour) {
  hour = hour || 12;
  const jd = toJD(y, m, d, hour - 8);
  for (const tryYear of [y, y + 1, y - 1]) {
    const months = buildYearMonths(tryYear);
    for (const mo of months) {
      if (jd >= mo.startJD && jd < mo.endJD) {
        const dayNum = Math.floor(jd - mo.startJD) + 1;
        return { rawMonth: mo.monthNum, day: dayNum, isLeap: mo.isLeap, jdMonthStart: mo.startJD, tryYear };
      }
    }
  }
  return null;
}

const BRANCHES = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const STEMS = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
const NAYIN_ELEMENTS = ["金","火","木","土","金","火","水","土","金","木","水","土","火","木","水","金","火","木","土","金","火","水","土","金","木","水","土","火","木","水"];
function nayinElement(ganzhiIndex) { return NAYIN_ELEMENTS[Math.floor(ganzhiIndex / 2)]; }
const ELEMENT_TO_JU = { "水": 2, "木": 3, "金": 4, "土": 5, "火": 6 };

function ziweiIndex(ju, day) {
  const branchStart = 2;
  const r = day % ju;
  if (r === 0) {
    const q = day / ju;
    return (branchStart + (q - 1)) % 12;
  }
  const diff = ju - r;
  const q = (day + diff) / ju;
  let pos = (branchStart + (q - 1)) % 12;
  if (diff % 2 === 1) pos = ((pos - diff) % 12 + 12) % 12;
  else pos = (pos + diff) % 12;
  return pos;
}

const PALACE_NAMES = ["命宮","兄弟","夫妻","子女","財帛","疾厄","遷移","交友","官祿","田宅","福德","父母"];
const YINGONG_STEM_BY_YEARSTEM = [2,4,6,8,0,2,4,6,8,0];

function stemAtBranch(branchIndex, yearStemIndex) {
  const yinStem = YINGONG_STEM_BY_YEARSTEM[yearStemIndex];
  const steps = (branchIndex - 2 + 12) % 12;
  return (yinStem + steps) % 10;
}

};

function hourToBranchIndex(hour) {
  const h = ((hour + 1) % 24);
  return Math.floor(h / 2) % 12;
}

function buildChart(y, m, d, hour, gender) {
  const lunar = solarToLunar(y, m, d, hour);
  if (!lunar) throw new Error("農曆換算失敗");
  const lunarYear = (lunar.rawMonth === 11 || lunar.rawMonth === 12) ? lunar.tryYear - 1 : lunar.tryYear;

  const ganzhiIndex = ((lunarYear - 1984) % 60 + 60) % 60;
  const yearStemIndex = ganzhiIndex % 10;
  const yearBranchIndex = ganzhiIndex % 12;

  const hourBranchIndex = hourToBranchIndex(hour);
  const monthNum = lunar.rawMonth;

  const monthPalaceIndex = (2 + monthNum - 1) % 12;
  const lifePalaceIndex = ((monthPalaceIndex - hourBranchIndex) % 12 + 12) % 12;
  const bodyPalaceIndex = (monthPalaceIndex + hourBranchIndex) % 12;

  const lifeStemIndex = stemAtBranch(lifePalaceIndex, yearStemIndex);
  const lifeGanzhiIndex = (() => {
    for (let i = 0; i < 60; i++) { if (i % 10 === lifeStemIndex && i % 12 === lifePalaceIndex) return i; }
    return 0;
  })();
  const element = nayinElement(lifeGanzhiIndex);
  const ju = ELEMENT_TO_JU[element];

  const ziweiPos = ziweiIndex(ju, lunar.day);
  const tianfuPos = (4 - ziweiPos + 12) % 12;

  const palaceOfBranch = {};
  for (let i = 0; i < 12; i++) {
    const branchIdx = (lifePalaceIndex + i) % 12;
    palaceOfBranch[branchIdx] = PALACE_NAMES[i];
  }

  const stemOfBranch = {};
  for (let b = 0; b < 12; b++) stemOfBranch[b] = stemAtBranch(b, yearStemIndex);

  const starsAtBranch = {};
  for (let b = 0; b < 12; b++) starsAtBranch[b] = [];
  ZIWEI_SERIES.forEach(s => {
    const idx = ((ziweiPos + s.offset) % 12 + 12) % 12;
    starsAtBranch[idx].push(s.name);
  });
  TIANFU_SERIES.forEach(s => {
    const idx = (tianfuPos + s.offset) % 12;
    starsAtBranch[idx].push(s.name);
  });

  const yearStem = STEMS[yearStemIndex];
  const sihua = SIHUA_TABLE[yearStem];
  const sihuaMark = {};
  ["祿","權","科","忌"].forEach((label, i) => { sihuaMark[sihua[i]] = label; });

  return {
    lunar: { year: lunarYear, month: monthNum, day: lunar.day, isLeap: lunar.isLeap },
    yearGanzhi: STEMS[yearStemIndex] + BRANCHES[yearBranchIndex],
    ju, juName: { 2:"水二局",3:"木三局",4:"金四局",5:"土五局",6:"火六局" }[ju],
    lifePalaceIndex, bodyPalaceIndex,
    palaceOfBranch, stemOfBranch, starsAtBranch, sihuaMark,
    ziweiPos, tianfuPos,
  };
}

function getLiuNian(chart, targetY, targetM, targetD) {
  const lunar = solarToLunar(targetY, targetM, targetD, 12);
  if (!lunar) throw new Error("流年農曆換算失敗");
  const lunarYear = (lunar.rawMonth === 11 || lunar.rawMonth === 12) ? lunar.tryYear - 1 : lunar.tryYear;
  const ganzhiIndex = ((lunarYear - 1984) % 60 + 60) % 60;
  const stemIndex = ganzhiIndex % 10;
  const branchIndex = ganzhiIndex % 12;
  const palaceName = chart.palaceOfBranch[branchIndex];
  const starsHere = chart.starsAtBranch[branchIndex];
  const yearStem = STEMS[stemIndex];
  const sihuaThisYear = SIHUA_TABLE[yearStem];
  const sihuaMarkThisYear = {};
  ["祿","權","科","忌"].forEach((label,i) => { sihuaMarkThisYear[sihuaThisYear[i]] = label; });
  const hitStars = starsHere.filter(s => sihuaMarkThisYear[s]).map(s => `${s}化${sihuaMarkThisYear[s]}`);
  return {
    solarYear: targetY, lunarYear,
    ganzhi: yearStem + BRANCHES[branchIndex],
    liuNianPalaceBranch: BRANCHES[branchIndex],
    correspondingNatalPalace: palaceName,
    starsInThisPalace: starsHere,
    sihuaHits: hitStars,
  };
}

  "天機": "腦筋轉得快，點子多，喜歡想東想西，但想法容易變來變去，靜不下心來。",
  "太陽": "個性直來直往、熱心、喜歡照顧別人，像太陽一樣把能量給出去，但有時候會太操心、太拚。",
  "武曲": "務實、行動派，講求效率跟結果，對錢和目標很有概念，但表達感情比較不擅長，看起來硬邦邦的。",
  "天同": "個性隨和、好相處，不喜歡衝突，容易知足常樂，但有時候也容易懶散、缺乏衝勁。",
  "廉貞": "熱情但情緒起伏大，很有個人魅力，敢愛敢恨，但一衝動容易做出讓自己後悔的決定。",
  "天府": "穩重、顧家、擅長理財規劃，做事按部就班，安全感很重要，但有時候比較保守、不太敢冒險。",
  "太陰": "細膩、體貼、觀察力強，內心感受豐富，重視家庭和情感，但情緒容易受環境影響，比較敏感。",
  "貪狼": "多才多藝、社交能力強、喜歡新鮮刺激的事物，人緣好，但容易三分鐘熱度，什麼都想嘗試卻不持久。",
  "巨門": "口才好、觀察力敏銳，很會分析、很會講道理，但講話有時候比較直接，容易得罪人或引起口舌是非。",
  "天相": "個性溫和、有服務精神，喜歡幫人處理事情、當和事佬，但比較沒主見，容易被別人的意見牽著走。",
  "天梁": "有長輩緣、責任感重，喜歡照顧、指導別人，做事講原則，但有時候會顯得愛說教、放不下身段。",
  "七殺": "個性剛強、有衝勁，遇到挑戰不退縮，做事雷厲風行，但脾氣比較急，容易跟人起衝突。",
  "破軍": "喜歡打破常規、開創新局面，適應力強、不怕改變，但也容易把事情弄得大起大落，不夠穩定。",
};

function buildZiweiSummary(chart) {
  const lifeStars = chart.starsAtBranch[chart.lifePalaceIndex]
    .filter(s => STAR_PLAIN_MEANING[s]);
  let borrowed = false;
  let usedStars = lifeStars;
  if (lifeStars.length === 0) {
    const oppositeIdx = (chart.lifePalaceIndex + 6) % 12;
    usedStars = chart.starsAtBranch[oppositeIdx].filter(s => STAR_PLAIN_MEANING[s]);
    borrowed = true;
  }
  if (usedStars.length === 0) {
    return { text: "命宮跟對宮剛好都沒有主星入座，這種盤在紫微斗數裡不算少見，個性上比較沒有單一鮮明的主色調，容易受身邊環境跟相處的人影響而調整自己。", borrowed: false };
  }
  const descriptions = usedStars.map(s => `**${s}星**：${STAR_PLAIN_MEANING[s]}`).join("\n");
  const prefix = borrowed
    ? "你的命宮本身沒有主星坐鎮（這種情況滿常見的，不用擔心），命理上會參考對面的遷移宮來看個性傾向："
    : "你的命宮主星是：";
  return { text: prefix + "\n\n" + descriptions, borrowed };
}

function renderZiweiChart(chart) {
  const cellPositions = [
    ["巳","午","未","申"],
    ["辰",null,null,"酉"],
    ["卯",null,null,"戌"],
    ["寅","丑","子","亥"],
  ];
  const summary = buildZiweiSummary(chart);
  const aiZiwei = aiCardPlaceholder('簡單說');
  let html = aiZiwei.html;
  html += '<div class="zw-meta">';
  html += `<div class="smart-chip"><span>農曆生日</span><strong>${chart.lunar.year}年${chart.lunar.isLeap?'閏':''}${chart.lunar.month}月${chart.lunar.day}日</strong></div>`;
  html += `<div class="smart-chip"><span>年干支</span><strong>${chart.yearGanzhi}</strong></div>`;
  html += `<div class="smart-chip"><span>五行局</span><strong>${chart.juName}</strong></div>`;
  html += `<div class="smart-chip"><span>命宮</span><strong>${BRANCHES[chart.lifePalaceIndex]}宮</strong></div>`;
  html += '</div>';

  html += '<div class="zw-grid">';
  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 4; c++) {
      const b = cellPositions[r][c];
      if (b === null) {
        if (r === 1 && c === 1) {
          html += `<div class="zw-center"><div class="zw-c-title">觀卜 · 紫微命盤</div>
            <div class="zw-c-line">${chart.yearGanzhi}年</div>
            <div class="zw-c-line">${chart.juName}</div>
            <div class="zw-c-line">身宮在${BRANCHES[chart.bodyPalaceIndex]}</div></div>`;
        }
        continue;
      }
      const branchIdx = BRANCHES.indexOf(b);
      const isLife = branchIdx === chart.lifePalaceIndex;
      const isBody = branchIdx === chart.bodyPalaceIndex;
      const palaceName = chart.palaceOfBranch[branchIdx];
      const stem = STEMS[chart.stemOfBranch[branchIdx]];
      const stars = chart.starsAtBranch[branchIdx];
      const mainStarSet = new Set(["紫微","天機","太陽","武曲","天同","廉貞","天府","太陰","貪狼","巨門","天相","天梁","七殺","破軍"]);
      html += `<div class="zw-cell${isLife?' life':''}${isBody?' body':''}">
        <span class="zw-stem">${stem}</span><span class="zw-branch">${b}</span>
        <div class="zw-stars">`;
      stars.forEach(s => {
        const sh = chart.sihuaMark[s];
        html += `<span class="zw-star${mainStarSet.has(s)?' main':''}">${s}${sh?`<span class="zw-sihua">${sh}</span>`:''}</span>`;
      });
      html += `</div><div class="zw-palace">${palaceName}</div></div>`;
    }
  }
  html += '</div>';
  html += '<div class="hint">紫色外框＝命宮；金色虛線＝身宮。四化標記（祿權科忌）以金色小字顯示在星名旁。</div>';
  html += '<div class="warning-note">紫微星定位與四化對照表為古籍固定演算法則，已盡量核對公開範例；農曆換算已用多筆已知節日日期實際驗證過。若發現與其他命盤軟體結果不同，歡迎回報比對。</div>';

  const mainStarSetForFacts = new Set(["紫微","天機","太陽","武曲","天同","廉貞","天府","太陰","貪狼","巨門","天相","天梁","七殺","破軍"]);
  const lifeStars = chart.starsAtBranch[chart.lifePalaceIndex].filter(s => mainStarSetForFacts.has(s));
  const facts = {
    農曆生日: `${chart.lunar.year}年${chart.lunar.isLeap?'閏':''}${chart.lunar.month}月${chart.lunar.day}日`,
    年干支: chart.yearGanzhi,
    五行局: chart.juName,
    命宮地支: BRANCHES[chart.lifePalaceIndex],
    身宮地支: BRANCHES[chart.bodyPalaceIndex],
    命宮是否有主星: lifeStars.length > 0 ? `有，是：${lifeStars.join('、')}` : "沒有主星（空宮），要參考對面遷移宮",
    遷移宮主星: chart.starsAtBranch[(chart.lifePalaceIndex + 6) % 12].filter(s => mainStarSetForFacts.has(s)),
    有四化的星: chart.sihuaMark,
  };

  const now = new Date();
  const liuNian = getLiuNian(chart, now.getFullYear(), now.getMonth() + 1, now.getDate());
  const aiLiuNian = aiCardPlaceholder(`${liuNian.solarYear}年流年提醒`);
  html += aiLiuNian.html;

  const liuNianFacts = {
    今年: `西元${liuNian.solarYear}年（農曆${liuNian.lunarYear}年，${liuNian.ganzhi}年）`,
    流年落在本命盤的宮位: liuNian.correspondingNatalPalace,
    這個宮位本來坐的星: liuNian.starsInThisPalace.length ? liuNian.starsInThisPalace : "沒有主星",
    今年四化打中的星: liuNian.sihuaHits.length ? liuNian.sihuaHits : "今年沒有主星被四化",
  };

  return { html, aiId: aiZiwei.id, facts, liuNianAiId: aiLiuNian.id, liuNianFacts };
}

document.getElementById('ziwei-btn').addEventListener('click', () => {
  const dateVal = document.getElementById('zw-date').value;
  const timeVal = document.getElementById('zw-hour').value;
  const gender = document.getElementById('zw-gender').value;
  const resultEl = document.getElementById('ziwei-result');
  if (!dateVal || !timeVal) {
    resultEl.innerHTML = '<div class="empty">請先輸入完整的出生日期與時間</div>';
    return;
  }
  const [y, m, d] = dateVal.split('-').map(Number);
  const [hh, mm] = timeVal.split(':').map(Number);
  const hourDecimal = hh + mm / 60;
  try {
    const chart = buildChart(y, m, d, hourDecimal, gender);
    const { html, aiId, facts, liuNianAiId, liuNianFacts } = renderZiweiChart(chart);
    resultEl.innerHTML = html;
    fillAiExplain(aiId, 'ziwei', '', facts);
    fillAiExplain(liuNianAiId, 'ziwei', '請針對今年的流年給提醒，不用重複命宮個性', liuNianFacts);
    attachChatSection('ziwei-result', 'ziwei', '紫微斗數流年與命盤分析', facts);
  } catch (e) {
    resultEl.innerHTML = `<div class="empty">排盤失敗：${e.message}</div>`;
  }
});

</script>
