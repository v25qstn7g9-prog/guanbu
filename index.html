<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>觀卜 v1.2 — AI 智慧判讀版</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+TC:wght@500;700&family=EB+Garamond:ital@0;1&display=swap');

  :root{
    --bg:#0B0B14;
    --panel:#15141F;
    --panel-border:#2A2438;
    --text:#EDE6D6;
    --sub:#8A8398;
    --gold:#C9A227;
    --crimson:#8B2635;
    --jade:#3F6659;
    --runic:#5C7A99;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:'EB Garamond', serif; min-height:100%;}
  body{
    background-image:
      radial-gradient(circle at 20% 0%, rgba(201,162,39,0.06), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(92,122,153,0.06), transparent 45%);
  }
  .app{max-width:460px;margin:0 auto;min-height:100vh;padding:22px 18px 60px;}

  .hero{text-align:center;margin-bottom:22px;}
  .hero .mark{font-size:13px;letter-spacing:.35em;color:var(--sub);margin-bottom:6px;}
  .hero h1{font-family:'Noto Serif TC',serif;font-weight:700;font-size:30px;margin:0;
    background:linear-gradient(120deg, var(--gold), #E8D48A 55%, var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero p{color:var(--sub);font-size:14px;margin-top:8px;font-style:italic;}

  .tabs{display:flex;gap:8px;margin-bottom:20px;}
  .tab{flex:1;padding:10px 4px;text-align:center;border-radius:12px;
    border:1px solid var(--panel-border);background:var(--panel);
    color:var(--sub);font-family:'Noto Serif TC',serif;font-size:13px;font-weight:700;
    cursor:pointer;transition:border-color .2s, color .2s;}
  .tab.active{color:var(--text);}
  .tab[data-t="yijing"].active{border-color:var(--jade);box-shadow:0 0 0 1px var(--jade) inset;}
  .tab[data-t="tarot"].active{border-color:var(--crimson);box-shadow:0 0 0 1px var(--crimson) inset;}
  .tab[data-t="runes"].active{border-color:var(--runic);box-shadow:0 0 0 1px var(--runic) inset;}
  .tab[data-t="daily"].active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}

  .panel{display:none;background:var(--panel);border:1px solid var(--panel-border);
    border-radius:16px;padding:22px 18px;min-height:280px;}
  .panel.active{display:block;}

  .section-title{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.18em;
    color:var(--sub);margin-bottom:14px;text-align:center;}
  .section-title.cn{font-family:'Noto Serif TC',serif;letter-spacing:.08em;}

  .btn{display:block;width:100%;padding:13px;border-radius:10px;border:none;
    font-family:'Noto Serif TC',serif;font-weight:700;font-size:15px;cursor:pointer;
    margin-top:16px;transition:transform .15s;}
  .btn:active{transform:scale(0.98);}
  .btn.jade{background:var(--jade);color:#EAF3EF;}
  .btn.crimson{background:var(--crimson);color:#F6E9EA;}
  .btn.runic{background:var(--runic);color:#EAF1F7;}
  .btn.gold{background:var(--gold);color:#1B1508;}

  /* --- I Ching --- */
  .hexagram{display:flex;flex-direction:column-reverse;gap:7px;align-items:center;margin:18px 0;}
  .line{width:150px;height:12px;display:flex;justify-content:space-between;}
  .line .bar{height:100%;background:var(--jade);border-radius:2px;}
  .line.solid .bar{width:100%;}
  .line.broken .bar{width:44%;}
  .line.changing{outline:1.5px dashed var(--gold);outline-offset:3px;}

  .result-name{text-align:center;font-family:'Noto Serif TC',serif;font-size:24px;
    font-weight:700;color:var(--gold);margin:14px 0 4px;}
  .result-sub{text-align:center;color:var(--sub);font-size:13px;margin-bottom:12px;}
  .result-text{font-size:16px;line-height:1.75;text-align:center;padding:0 4px;}

  /* --- Tarot --- */
  .cards-row{display:flex;justify-content:center;gap:10px;margin:16px 0;flex-wrap:wrap;}
  .tcard{width:74px;height:118px;border-radius:8px;position:relative;
    background:linear-gradient(160deg,#1D1420,#2A1620);
    border:1px solid var(--crimson);display:flex;align-items:center;justify-content:center;
    font-family:'Cinzel',serif;color:var(--crimson);font-size:11px;text-align:center;
    box-shadow:0 6px 16px rgba(0,0,0,.4);}
  .tcard .rev{transform:rotate(180deg);}
  .tcard-name{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.05em;
    color:var(--crimson);text-align:center;margin-top:8px;}

  /* --- Runes --- */
  .rune-glyph{text-align:center;font-size:56px;color:var(--runic);margin:10px 0 4px;
    text-shadow:0 0 18px rgba(92,122,153,.5);}
  .rune-name{text-align:center;font-family:'Cinzel',serif;font-size:16px;color:var(--runic);
    letter-spacing:.08em;}

  /* --- Daily --- */
  .stars{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;
    border-bottom:1px solid var(--panel-border);}
  .stars:last-child{border-bottom:none;}
  .stars .label{font-family:'Noto Serif TC',serif;font-size:14px;color:var(--sub);}
  .stars .dots span{color:var(--panel-border);font-size:15px;}
  .stars .dots span.on{color:var(--gold);}
  .daily-msg{margin-top:16px;font-size:15px;line-height:1.7;text-align:center;
    font-style:italic;color:var(--text);}
  .daily-date{text-align:center;color:var(--sub);font-size:12px;margin-bottom:6px;
    letter-spacing:.1em;}

  .field{margin:10px 0 14px;}
  .field label{display:block;color:var(--sub);font-family:'Noto Serif TC',serif;font-size:12px;margin-bottom:7px;}
  .input,.select{width:100%;background:#0F0E17;color:var(--text);border:1px solid var(--panel-border);
    border-radius:10px;padding:11px 12px;font-size:14px;outline:none;}
  .input:focus,.select:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,162,39,.08);}
  .mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .meta-card{margin:12px 0;padding:12px;border:1px solid var(--panel-border);border-radius:12px;background:#11101A;}
  .meta-row{display:flex;justify-content:space-between;gap:12px;padding:4px 0;color:var(--sub);font-size:13px;}
  .meta-row strong{color:var(--text);font-weight:600;text-align:right;}
  .moving{color:var(--gold);}
  .hex-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;}
  .hex-box{padding:10px 6px;border:1px solid var(--panel-border);border-radius:12px;background:#11101A;}
  .hex-box .hexagram{margin:10px 0;}
  .hex-box .line{width:110px;height:9px;}
  .hex-box .result-name{font-size:20px;margin-top:8px;}
  .hex-box .result-sub{margin-bottom:4px;}
  .tag{display:inline-block;padding:3px 7px;border-radius:999px;background:#201C13;color:#E8D48A;font-size:11px;margin:2px;}
  .question-echo{font-family:'Noto Serif TC',serif;text-align:center;color:#D9CFB7;font-size:14px;line-height:1.6;margin:8px 0 14px;}
  .hint{font-size:12px;color:var(--sub);line-height:1.55;margin-top:8px;}
  .toolbar{display:flex;gap:8px;margin-top:10px;}
  .btn.secondary{background:#211F2B;color:var(--sub);border:1px solid var(--panel-border);}
  .btn.small{padding:9px 10px;margin-top:0;font-size:13px;}
  @media (max-width:380px){.hex-pair{grid-template-columns:1fr}.mini-grid{grid-template-columns:1fr;}}


  .smart-card{margin:14px 0;padding:15px;border:1px solid rgba(201,162,39,.35);border-radius:14px;background:linear-gradient(160deg,#171520,#111019);}
  .smart-title{font-family:'Noto Serif TC',serif;font-size:13px;color:var(--gold);letter-spacing:.08em;margin-bottom:9px;}
  .smart-text{font-size:15px;line-height:1.75;color:var(--text);}
  .smart-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
  .smart-chip{border:1px solid var(--panel-border);border-radius:10px;padding:9px;background:#0F0E17;}
  .smart-chip span{display:block;color:var(--sub);font-size:11px;margin-bottom:3px;}
  .smart-chip strong{font-family:'Noto Serif TC',serif;font-size:13px;color:var(--text);}
  .badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#211D14;color:#E8D48A;font-size:11px;margin:2px;}
  .warning-note{margin-top:10px;padding:10px 12px;border-left:3px solid var(--gold);background:#121119;color:var(--sub);font-size:12px;line-height:1.6;}


  .answer-card{margin:14px 0 12px;padding:16px;border:1px solid rgba(201,162,39,.58);
    border-radius:15px;background:linear-gradient(145deg,#1B1821,#111019);
    box-shadow:0 8px 28px rgba(0,0,0,.18);}
  .answer-kicker{font-family:'Noto Serif TC',serif;color:var(--gold);font-size:12px;
    letter-spacing:.12em;margin-bottom:8px;}
  .answer-main{font-family:'Noto Serif TC',serif;font-size:19px;line-height:1.55;
    color:#F2E8CF;font-weight:700;}
  .answer-sub{margin-top:8px;color:var(--sub);font-size:13px;line-height:1.65;}
  .meter{height:7px;background:#24212D;border-radius:999px;overflow:hidden;margin-top:7px;}
  .meter > i{display:block;height:100%;background:linear-gradient(90deg,var(--jade),var(--gold));border-radius:999px;}
  .why-list{margin:10px 0 0;padding-left:18px;color:var(--text);font-size:13px;line-height:1.65;}
  .why-list li{margin:4px 0;}

  .empty{color:var(--sub);text-align:center;font-size:14px;padding:40px 10px;line-height:1.8;}
  .footer-note{text-align:center;color:var(--sub);font-size:11px;margin-top:26px;
    letter-spacing:.05em;}
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <div class="mark">D I V I N A T I O N</div>
    <h1>觀卜</h1>
    <p>易經 · 塔羅 · 盧恩 · 每日運勢 · v1.2 AI 智慧判讀</p>
  </div>

  <div class="tabs">
    <div class="tab active" data-t="yijing">易經</div>
    <div class="tab" data-t="tarot">塔羅</div>
    <div class="tab" data-t="runes">符文</div>
    <div class="tab" data-t="daily">今日運勢</div>
  </div>

  <div class="panel active" id="panel-yijing">
    <div class="section-title cn">起卦問事</div>
    <div class="field">
      <label for="yijing-question">你想問什麼？</label>
      <input class="input" id="yijing-question" maxlength="120" placeholder="例：2027 年工作是否會有重大轉變？" />
      <div class="hint">問題越單一越好。起卦後會顯示本卦、動爻與之卦。</div>
    </div>
    <div id="yijing-result">
      <div class="empty">心中默想欲問之事<br/>按下起卦，以三枚銅錢法擲出六爻</div>
    </div>
    <button class="btn jade" id="yijing-btn">起卦</button>
  </div>

  <div class="panel" id="panel-tarot">
    <div class="section-title">MAJOR ARCANA</div>
    <div class="field"><label for="tarot-question">問題（可留白）</label><input class="input" id="tarot-question" maxlength="120" placeholder="例：這件事接下來三個月的發展？" /></div>
    <div class="field"><label for="tarot-mode">牌陣</label><select class="select" id="tarot-mode"><option value="1">單張指引</option><option value="3">三張牌｜過去・現在・未來</option></select></div>
    <div id="tarot-result">
      <div class="empty">靜心片刻<br/>抽牌看看此刻該留意什麼</div>
    </div>
    <button class="btn crimson" id="tarot-btn">抽牌</button>
  </div>

  <div class="panel" id="panel-runes">
    <div class="section-title">ELDER FUTHARK</div>
    <div class="field"><label for="runes-question">問題（可留白）</label><input class="input" id="runes-question" maxlength="120" placeholder="例：我現在最需要注意什麼？" /></div>
    <div class="field"><label for="runes-mode">符文陣</label><select class="select" id="runes-mode"><option value="1">單枚指引</option><option value="3">三枚｜現況・阻力・建議</option></select></div>
    <div id="runes-result">
      <div class="empty">伸手入符文袋中<br/>抽出符文，聆聽它的訊息</div>
    </div>
    <button class="btn runic" id="runes-btn">抽符文</button>
  </div>

  <div class="panel" id="panel-daily">
    <div class="section-title cn">今日運勢</div>
    <div class="field"><label for="daily-birth">生日（選填，用來個人化每日 seed）</label><input class="input" type="date" id="daily-birth" /></div>
    <div id="daily-result">
      <div class="empty">按下查看，抓出今天的運勢</div>
    </div>
    <button class="btn gold" id="daily-btn">查看今日運勢</button>
  </div>

  <div class="footer-note">僅供參考娛樂｜v1.2 本機 AI 式判讀｜重要決策仍以現實資訊為準</div>
</div>

<script>
// ---------------- tab switching ----------------
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('panel-'+t.dataset.t).classList.add('active');
  });
});

// ---------------- helpers ----------------
function esc(s){
  return String(s||'').replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function lineLabel(i){ return ["初爻","二爻","三爻","四爻","五爻","上爻"][i]; }
function hexFromBits(bits){
  const lowerIdx = trigramIndex(bits.slice(0,3));
  const upperIdx = trigramIndex(bits.slice(3,6));
  return TRI_MATRIX[upperIdx][lowerIdx];
}
function classifyQuestion(q){
  q=(q||'').toLowerCase();
  const groups=[
    ['財務',['錢','財','債','卡債','股票','投資','資產','收入','配息','成本','買','賣']],
    ['工作',['工作','職場','公司','升遷','轉職','主管','同事','事業','退休']],
    ['感情',['感情','愛情','老婆','老公','伴侶','結婚','分手','復合','關係']],
    ['健康',['健康','身體','睡眠','恢復','訓練','運動','疾病','醫療']],
    ['時間',['什麼時候','何時','多久','幾月','幾年','今年','明年','時間']],
    ['選擇',['要不要','是否','該不該','可以嗎','選哪個','哪一個']]
  ];
  const hits=[];
  groups.forEach(([name,ks])=>{ if(ks.some(k=>q.includes(k))) hits.push(name); });
  return hits.length?hits:['一般'];
}
function intentAdvice(tags){
  if(tags.includes('財務')) return '把象徵訊息落到現金流、利率、還款順序與可執行數字；占卜不替代財務試算。';
  if(tags.includes('工作')) return '把訊息落到職務變化、權責、人際與可控行動，不把單一象徵視為必然事件。';
  if(tags.includes('健康')) return '只把牌義當作自我觀察提示；症狀、用藥與治療仍以醫療專業為準。';
  if(tags.includes('感情')) return '優先看溝通、界線與雙方行動，不把牌義當作對方內心的事實。';
  return '把結果當作整理問題的框架，再用現實資訊驗證。';
}

function analyzeIntent(q){
  q=(q||'').trim();
  const out={type:'trend',label:'趨勢',horizon:'未指定'};
  if(/什麼時候|何時|多久|幾月|幾年|何年|時間/.test(q)){out.type='when';out.label='時間';}
  else if(/要不要|是否|會不會|能不能|可以嗎|該不該|有沒有/.test(q)){out.type='yesno';out.label='是非・傾向';}
  else if(/怎麼|如何|怎樣|辦法|建議/.test(q)){out.type='how';out.label='方法・建議';}
  else if(/哪一個|哪個|選擇|選哪/.test(q)){out.type='choice';out.label='選擇';}
  if(/今天|今日/.test(q)) out.horizon='今日';
  else if(/這週|本週|一週/.test(q)) out.horizon='一週';
  else if(/這個月|本月|一個月/.test(q)) out.horizon='一個月';
  else if(/三個月|3個月/.test(q)) out.horizon='三個月';
  else if(/半年|六個月|6個月/.test(q)) out.horizon='半年';
  else if(/今年/.test(q)) out.horizon='今年';
  else if(/明年/.test(q)) out.horizon='明年';
  else if(/20\d{2}/.test(q)) out.horizon=(q.match(/20\d{2}/)||[])[0]||'指定年份';
  return out;
}
function confidenceLabel(v){
  if(v>=78) return '高';
  if(v>=58) return '中高';
  if(v>=40) return '中';
  return '偏低';
}
function answerCardHTML(a){
  const reasons=(a.reasons||[]).map(x=>`<li>${esc(x)}</li>`).join('');
  return `<div class="answer-card">
    <div class="answer-kicker">AI 式直接回答</div>
    <div class="answer-main">${esc(a.answer)}</div>
    <div class="answer-sub">${esc(a.sub||'')}</div>
    <div class="smart-grid">
      <div class="smart-chip"><span>判讀方向</span><strong>${esc(a.direction||'觀察中')}</strong></div>
      <div class="smart-chip"><span>象徵時間窗</span><strong>${esc(a.window||'未指定')}</strong></div>
      <div class="smart-chip"><span>問題意圖</span><strong>${esc(a.intent||'趨勢')}</strong></div>
      <div class="smart-chip"><span>指向明確度</span><strong>${esc(a.clarity||'中')}</strong><div class="meter"><i style="width:${Math.max(8,Math.min(100,a.confidence||50))}%"></i></div></div>
    </div>
    ${reasons?`<ul class="why-list">${reasons}</ul>`:''}
  </div>`;
}
const TAROT_AI = [
  {tone:0,pace:1,agency:1,key:'新開始'}, {tone:2,pace:2,agency:2,key:'主動創造'},
  {tone:0,pace:-1,agency:0,key:'等待直覺'}, {tone:2,pace:0,agency:1,key:'成長滋養'},
  {tone:1,pace:0,agency:2,key:'秩序掌控'}, {tone:0,pace:-1,agency:0,key:'制度與指引'},
  {tone:1,pace:0,agency:1,key:'抉擇與關係'}, {tone:2,pace:2,agency:2,key:'推進突破'},
  {tone:1,pace:0,agency:1,key:'穩定韌性'}, {tone:0,pace:-2,agency:0,key:'沉澱'},
  {tone:1,pace:2,agency:0,key:'局勢轉動'}, {tone:1,pace:0,agency:1,key:'清算與平衡'},
  {tone:-1,pace:-2,agency:-1,key:'暫停換角度'}, {tone:0,pace:1,agency:1,key:'結束與重啟'},
  {tone:1,pace:-1,agency:1,key:'調整平衡'}, {tone:-2,pace:-1,agency:-1,key:'束縛與執著'},
  {tone:-2,pace:2,agency:-1,key:'劇變'}, {tone:2,pace:0,agency:0,key:'希望恢復'},
  {tone:-1,pace:-1,agency:-1,key:'迷霧'}, {tone:3,pace:2,agency:1,key:'明朗成功'},
  {tone:2,pace:1,agency:1,key:'覺醒定案'}, {tone:3,pace:0,agency:1,key:'完成收尾'}
];
function tarotVector(p){
  const m=TAROT_AI[p.idx];
  const rev=p.reversed?-1:1;
  return {tone:m.tone*rev, pace:m.pace*(p.reversed?-0.65:1), agency:m.agency*rev, key:m.key};
}
function timingFromTarot(picks){
  let score=0;
  picks.forEach((p,i)=>{ const v=tarotVector(p); score += v.pace*(i===picks.length-1?1.25:1); });
  if(score>=3) return '近期｜數週到約 1–3 個月的節奏';
  if(score<=-2.2) return '偏慢｜數月級，先整理條件再看進展';
  return '中期｜較像數月內逐步推進，不像立即定局';
}
function tarotAnswer(picks,q){
  const tags=classifyQuestion(q), intent=analyzeIntent(q);
  const vs=picks.map(tarotVector);
  const weights=picks.length===3?[0.65,1.15,1.45]:[1.2];
  let score=0, agency=0;
  vs.forEach((v,i)=>{score+=v.tone*weights[i]; agency+=v.agency*weights[i];});
  const signs=vs.map(v=>Math.sign(v.tone)).filter(Boolean);
  const same=signs.length>1 && signs.every(s=>s===signs[0]);
  let confidence=48 + (same?22:0) + Math.min(18,Math.abs(score)*5);
  if(picks.length===3 && Math.sign(vs[1].tone)!==Math.sign(vs[2].tone) && vs[1].tone && vs[2].tone) confidence-=12;
  confidence=Math.round(Math.max(28,Math.min(92,confidence)));
  let direction=score>=2.2?'偏正向':score<=-2.2?'偏阻滯':'未完全定局';
  let window=timingFromTarot(picks);

function hexAnswer(hexNum,changedNum,moving,q){

  const pos=moving.length?moving.reduce((a,b)=>a+b,0)/moving.length:null;
  if(pos!==null){
    if(pos<1.5) pace += '，變化偏前段';
    else if(pos>3.5) pace += '，結果偏後段';
    else pace += '，轉折落在過程中段';
  }
  let answer='';
  if(intent.type==='when'){
    answer = future>0 ? `有轉機，但時間不是「立刻」；${pace.replace('｜','，')}。` :
             future<0 ? `時間點偏延後；${pace.replace('｜','，')}，先處理阻力會更重要。` :
             `目前卦象較難壓成單一日期；${pace.replace('｜','，')}。`;
  }else if(intent.type==='yesno'){
    answer = score>.7?'卦勢偏向「有機會／可成」，但要順勢而做，不宜硬推。':
             score<-.7?'卦勢偏向「不宜急進／容易受阻」，先調整條件再行動。':
             '卦勢屬「未完全定局」，關鍵在動爻所代表的轉折與後續選擇。';
  }else if(intent.type==='how'){
    answer = future>0?'做法上宜順著之卦的方向推進，把眼前問題拆小並逐步處理。':
             future<0?'做法上先守、先修正，再求突破；現在不是硬碰硬的好時機。':
             '做法上先觀察局勢與動爻位置，確認真正變動點再出手。';
  }else{
    answer = future>0?'整體趨勢由現況往較有利方向移動，但仍要經過中間轉折。':
             future<0?'整體趨勢顯示後續仍有阻力，保守調整比急著定局更合適。':
             '整體趨勢仍在轉化中，現在較適合看變化方向，不宜硬下結論。';
  }
  const reasons=[
    `本卦「${HEX_NAMES[hexNum]}」代表目前背景；之卦「${HEX_NAMES[changedNum]}」代表變化後的主題。`,
    moving.length?`共有 ${moving.length} 個動爻，位置在 ${moving.map(lineLabel).join('、')}。`:'此卦無動爻，代表目前局勢相對穩定。'
  ];
  if(tags.includes('財務')) reasons.push('財務問題仍需用現金流、負債成本與實際數字驗證。');
  return {tags,intent,answer,direction:future>0?'往有利方向':future<0?'先守後調整':'中性轉化',window:pace,confidence,clarity:confidenceLabel(confidence),reasons};
}

  // three-coin method: sum of 2 or 3 per coin, heads(3)=yang, tails(2)=yin
  let sum=0;
  for(let i=0;i<3;i++) sum += Math.random()<0.5?2:3;
  return sum; // 6=old yin, 7=young yang, 8=young yin, 9=old yang

  const key = bits.join('');

  return map[key];
}

document.getElementById('tarot-btn').addEventListener('click', ()=>{
  const mode = Number(document.getElementById('tarot-mode').value);
  const question = document.getElementById('tarot-question').value.trim();
  const picked = [];
  const used = new Set();
  while(picked.length<mode){
    const idx = Math.floor(Math.random()*TAROT.length);
    if(used.has(idx)) continue;
    used.add(idx);
    picked.push({idx,reversed:Math.random()<0.35});
  }
  const labels = mode===3?["過去","現在","未來"]:["指引"];
  let html = question?`<div class="question-echo">「${esc(question)}」</div>`:'';
  html += '<div class="cards-row">';

  html += '</div>';
  picked.forEach((p,i)=>{
    const [name,text]=TAROT[p.idx];
    const meaning = p.reversed ? TAROT_REVERSED[p.idx] : text;
    html += `<div class="meta-card"><div class="meta-row"><span>${labels[i]}</span><strong>${name}${p.reversed?'（逆位）':'（正位）'}</strong></div><div class="result-text" style="text-align:left">${meaning}</div></div>`;

    direction:direct.direction, window:direct.window, intent:direct.intent.label,
    confidence:direct.confidence, clarity:direct.clarity, reasons:direct.reasons
  });
  const smart = tarotSynthesis(picked,labels,question);
  html += `<div class="smart-card"><div class="smart-title">智慧綜合判讀</div><div class="smart-text">${smart.core}</div><div class="smart-grid"><div class="smart-chip"><span>問題類型</span><strong>${smart.tags.join('・')}</strong></div><div class="smart-chip"><span>時間節奏</span><strong>${smart.timing}</strong></div></div><div class="warning-note">${smart.advice}</div></div>`;
  document.getElementById('tarot-result').innerHTML = html;
});

function seedFromDate(extra=''){
  const d = new Date();
  const key = `${d.getFullYear()}${d.getMonth()}${d.getDate()}|${extra}`;
  let h = 0;
  for(let i=0;i<key.length;i++){ h = (h*31 + key.charCodeAt(i)) >>> 0; }
  return h;
}
function seededRandom(seed){
  let s = seed;
  return function(){
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
}

document.getElementById('daily-btn').addEventListener('click', ()=>{
  const birth = document.getElementById('daily-birth').value || '';
  if(birth) localStorage.setItem('guanbu_birth', birth);
  const seed = seedFromDate(birth);
  const rnd = seededRandom(seed);
  const cats = [["愛情",rnd],["事業",rnd],["財運",rnd],["健康",rnd]];
  const d = new Date();
  const dateStr = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
  let html = `<div class="daily-date">${dateStr}</div>`;
  const scored=[];
  cats.forEach(([label])=>{
    const score = 2 + Math.floor(rnd()*4); // 2-5
    scored.push([label,score]);
    let dots = '';
    for(let i=0;i<5;i++) dots += `<span class="${i<score?'on':''}">★</span>`;
    html += `<div class="stars"><span class="label">${label}</span><span class="dots">${dots}</span></div>`;
  });
  const msgIdx = seed % DAILY_MSGS.length;
  html += `<div class="daily-msg">${DAILY_MSGS[msgIdx]}</div>`;
  const best=[...scored].sort((a,b)=>b[1]-a[1])[0], low=[...scored].sort((a,b)=>a[1]-b[1])[0];
  html += `<div class="smart-card"><div class="smart-title">今日焦點</div><div class="smart-text">相對較順的是「${best[0]}」，比較需要保守的是「${low[0]}」。把它當作今天的注意力排序，而不是預測事件一定發生。</div><div class="warning-note">同一生日在同一天會得到固定結果；資料只存在你的瀏覽器 localStorage。</div></div>`;
  document.getElementById('daily-result').innerHTML = html;
});
