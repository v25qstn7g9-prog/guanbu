<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>觀卜 Guanbu — Divination App</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+TC:wght@500;700&family=EB+Garamond:ital@0;1&display=swap');

  :root{
    --bg:#0B0B14;
    --panel:#15141F;
    --panel-border:#2A2438;
    --text:#EDE6D6;
    --sub:#8A8398;
    --gold:#C9A227;
    --crimson:#8B2635;
    --jade:#3F6659;
    --runic:#5C7A99;
    --violet:#6B4E8E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:'EB Garamond', serif; min-height:100%;}
  body{
    background-image:
      radial-gradient(circle at 20% 0%, rgba(201,162,39,0.06), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(92,122,153,0.06), transparent 45%);
  }
  .app{max-width:460px;margin:0 auto;min-height:100vh;padding:22px 18px 60px;}

  .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .lang-btn{background:#1B1A26;border:1px solid var(--gold);color:var(--gold);
    padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;font-family:'Noto Serif TC',serif;}

  .hero{text-align:center;margin-bottom:22px;}
  .hero .mark{font-size:13px;letter-spacing:.35em;color:var(--sub);margin-bottom:6px;}
  .hero h1{font-family:'Noto Serif TC',serif;font-weight:700;font-size:30px;margin:0;
    background:linear-gradient(120deg, var(--gold), #E8D48A 55%, var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero p{color:var(--sub);font-size:14px;margin-top:8px;font-style:italic;}

  .tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .tab{flex:1;min-width:60px;padding:10px 4px;text-align:center;border-radius:12px;
    border:1px solid var(--panel-border);background:var(--panel);
    color:var(--sub);font-family:'Noto Serif TC',serif;font-size:13px;font-weight:700;
    cursor:pointer;transition:border-color .2s, color .2s;}
  .tab.active{color:var(--text);}
  .tab[data-t="yijing"].active{border-color:var(--jade);box-shadow:0 0 0 1px var(--jade) inset;}
  .tab[data-t="tarot"].active{border-color:var(--crimson);box-shadow:0 0 0 1px var(--crimson) inset;}
  .tab[data-t="runes"].active{border-color:var(--runic);box-shadow:0 0 0 1px var(--runic) inset;}
  .tab[data-t="daily"].active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}
  .tab[data-t="ziwei"].active{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet) inset;}

  .panel{display:none;background:var(--panel);border:1px solid var(--panel-border);
    border-radius:16px;padding:22px 18px;min-height:280px;}
  .panel.active{display:block;}

  .section-title{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.18em;
    color:var(--sub);margin-bottom:14px;text-align:center;}
  .section-title.cn{font-family:'Noto Serif TC',serif;letter-spacing:.08em;}

  .btn{display:block;width:100%;padding:13px;border-radius:10px;border:none;
    font-family:'Noto Serif TC',serif;font-weight:700;font-size:15px;cursor:pointer;
    margin-top:16px;transition:transform .15s;}
  .btn:active{transform:scale(0.98);}
  .btn.jade{background:var(--jade);color:#EAF3EF;}
  .btn.crimson{background:var(--crimson);color:#F6E9EA;}
  .btn.runic{background:var(--runic);color:#EAF1F7;}
  .btn.gold{background:var(--gold);color:#1B1508;}

  /* --- I Ching --- */
  .hexagram{display:flex;flex-direction:column-reverse;gap:7px;align-items:center;margin:18px 0;}
  .line{width:150px;height:12px;display:flex;justify-content:space-between;}
  .line .bar{height:100%;background:var(--jade);border-radius:2px;}
  .line.solid .bar{width:100%;}
  .line.broken .bar{width:44%;}
  .line.changing{outline:1.5px dashed var(--gold);outline-offset:3px;}

  .result-name{text-align:center;font-family:'Noto Serif TC',serif;font-size:24px;
    font-weight:700;color:var(--gold);margin:14px 0 4px;}
  .result-sub{text-align:center;color:var(--sub);font-size:13px;margin-bottom:12px;}
  .result-text{font-size:16px;line-height:1.75;text-align:center;padding:0 4px;}

  /* --- Tarot --- */
  .cards-row{display:flex;justify-content:center;gap:10px;margin:16px 0;flex-wrap:wrap;}
  .rune-glyph{text-align:center;font-size:56px;color:var(--runic);margin:10px 0 4px;
    text-shadow:0 0 18px rgba(92,122,153,.5);}
  .rune-name{text-align:center;font-family:'Cinzel',serif;font-size:16px;color:var(--runic);
    letter-spacing:.08em;}

  /* --- Daily --- */
  .stars{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;
    border-bottom:1px solid var(--panel-border);}
  .stars:last-child{border-bottom:none;}
  .stars .label{font-family:'Noto Serif TC',serif;font-size:14px;color:var(--sub);}
  .stars .dots span{color:var(--panel-border);font-size:15px;}
  .stars .dots span.on{color:var(--gold);}
  .daily-msg{margin-top:16px;font-size:15px;line-height:1.7;text-align:center;
    font-style:italic;color:var(--text);}
  .daily-date{text-align:center;color:var(--sub);font-size:12px;margin-bottom:6px;
    letter-spacing:.1em;}

  .field{margin:10px 0 14px;}
  .field label{display:block;color:var(--sub);font-family:'Noto Serif TC',serif;font-size:12px;margin-bottom:7px;}
  .input,.select{width:100%;background:#0F0E17;color:var(--text);border:1px solid var(--panel-border);
    border-radius:10px;padding:11px 12px;font-size:14px;outline:none;}
  .input:focus,.select:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,162,39,.08);}
  .mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .meta-card{margin:12px 0;padding:12px;border:1px solid var(--panel-border);border-radius:12px;background:#11101A;}
  .meta-row{display:flex;justify-content:space-between;gap:12px;padding:4px 0;color:var(--sub);font-size:13px;}
  .meta-row strong{color:var(--text);font-weight:600;text-align:right;}
  .moving{color:var(--gold);}
  .hex-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;}
  .hex-box{padding:10px 6px;border:1px solid var(--panel-border);border-radius:12px;background:#11101A;}
  .hex-box .hexagram{margin:10px 0;}
  .hex-box .line{width:110px;height:9px;}
  .hex-box .result-name{font-size:20px;margin-top:8px;}
  .hex-box .result-sub{margin-bottom:4px;}
  .tag{display:inline-block;padding:3px 7px;border-radius:999px;background:#201C13;color:#E8D48A;font-size:11px;margin:2px;}
  .question-echo{font-family:'Noto Serif TC',serif;text-align:center;color:#D9CFB7;font-size:14px;line-height:1.6;margin:8px 0 14px;}
  .hint{font-size:12px;color:var(--sub);line-height:1.55;margin-top:8px;}
  .toolbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .btn.secondary{background:#211F2B;color:var(--sub);border:1px solid var(--panel-border);}
  .btn.small{padding:9px 10px;margin-top:0;font-size:13px;}
  @media (max-width:380px){.hex-pair{grid-template-columns:1fr}.mini-grid{grid-template-columns:1fr;}}

  .smart-card{margin:14px 0;padding:15px;border:1px solid rgba(201,162,39,.35);border-radius:14px;background:linear-gradient(160deg,#171520,#111019);}
  .smart-title{font-family:'Noto Serif TC',serif;font-size:13px;color:var(--gold);letter-spacing:.08em;margin-bottom:9px;}
  .smart-text{font-size:15px;line-height:1.75;color:var(--text);}
  .smart-chip{border:1px solid var(--panel-border);border-radius:10px;padding:9px;background:#0F0E17;}
  .smart-chip span{display:block;color:var(--sub);font-size:11px;margin-bottom:3px;}
  .smart-chip strong{font-family:'Noto Serif TC',serif;font-size:13px;color:var(--text);}

  .empty{color:var(--sub);text-align:center;font-size:14px;padding:40px 10px;line-height:1.8;}
  .footer-note{text-align:center;color:var(--sub);font-size:11px;margin-top:26px;letter-spacing:.05em;}

  /* --- Zi Wei chart grid --- */
  .zw-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0;}
  .zw-meta .smart-chip{border-color:rgba(107,78,142,.4);}
  .zw-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);
    gap:4px;aspect-ratio:1/1;margin:14px 0;}
  .zw-cell{border:1px solid var(--panel-border);border-radius:8px;background:#11101A;
    padding:5px 4px;display:flex;flex-direction:column;font-size:10px;position:relative;overflow:hidden;}
  .zw-cell.life{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet) inset;}
  .zw-cell.body{outline:1.5px dashed var(--gold);outline-offset:-3px;}
  .zw-cell .zw-branch{position:absolute;top:3px;right:5px;color:var(--sub);font-size:9px;}
  .zw-cell .zw-stem{position:absolute;top:3px;left:5px;color:var(--sub);font-size:9px;}
  .zw-cell .zw-palace{font-family:'Noto Serif TC',serif;font-size:11px;color:var(--gold);
    margin-top:14px;text-align:center;}
  .zw-cell .zw-stars{margin-top:4px;display:flex;flex-direction:column;gap:1px;align-items:center;}
  .zw-cell .zw-star{color:var(--text);font-size:11px;font-family:'Noto Serif TC',serif;white-space:nowrap;}
  .zw-cell .zw-star.main{color:#E8D4F5;font-weight:700;}
  .zw-cell .zw-sihua{color:var(--gold);font-size:9px;margin-left:2px;}
  .zw-cell .zw-aux{font-size:9px;white-space:nowrap;}
  .zw-cell .zw-aux.lucky{color:var(--jade);}
  .zw-cell .zw-aux.wealth{color:var(--gold);}
  .zw-cell .zw-aux.unlucky{color:var(--crimson);}
  .zw-cell .zw-daxian{position:absolute;bottom:3px;right:5px;color:var(--sub);font-size:8px;}
  .zw-center{grid-column:2/4;grid-row:2/4;border:1px solid rgba(107,78,142,.4);border-radius:10px;
    background:linear-gradient(160deg,#1B1620,#111019);display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:8px;text-align:center;}
  .zw-center .zw-c-title{font-family:'Noto Serif TC',serif;color:var(--violet);font-size:12px;margin-bottom:4px;}
  .zw-center .zw-c-line{color:var(--sub);font-size:11px;line-height:1.6;}
  @media (max-width:380px){.zw-cell{font-size:9px;}.zw-cell .zw-star{font-size:10px;}}

  /* ===== v3.1 讓人想用的介面強化 ===== */
  .hero .tagline{font-family:'Noto Serif TC',serif;color:#D9CFB7;font-size:15px;margin-top:10px;font-style:normal;letter-spacing:.06em;}
  .daily-quote{margin:14px auto 0;max-width:360px;padding:11px 14px;border:1px solid rgba(201,162,39,.25);border-radius:12px;
    background:rgba(201,162,39,.05);font-size:13.5px;color:#D9CFB7;line-height:1.65;font-family:'Noto Serif TC',serif;text-align:left;}
  .daily-quote b{color:var(--gold);font-weight:700;margin-right:6px;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;}
  .chip{padding:6px 11px;border-radius:999px;border:1px solid var(--panel-border);background:#0F0E17;color:var(--sub);
    font-size:12.5px;cursor:pointer;font-family:'Noto Serif TC',serif;transition:border-color .2s,color .2s;}
  .chip:hover,.chip:active{border-color:var(--gold);color:var(--gold);}
  .btn:disabled{opacity:.6;cursor:wait;}
  .meta-row span{flex-shrink:0;}
  .panel .btn.main-action{margin:4px 0 16px;box-shadow:0 6px 18px rgba(0,0,0,.35);}

  .ritual{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:36px 10px;min-height:210px;}
  .ritual-text{color:#D9CFB7;font-family:'Noto Serif TC',serif;font-size:14px;letter-spacing:.08em;text-align:center;animation:breathe 1.6s ease-in-out infinite;}
  @keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
  .coins{display:flex;gap:16px;perspective:400px;}
  .coin{width:42px;height:42px;border-radius:50%;position:relative;
    background:radial-gradient(circle at 35% 35%,#F4E3A0,#C9A227 55%,#7A5E12);box-shadow:0 0 16px rgba(201,162,39,.45);
    animation:coinflip .55s linear infinite;}
  .coin::after{content:'';position:absolute;inset:14px;border:2px solid #5C470D;border-radius:2px;}
  .coin:nth-child(2){animation-delay:.14s}.coin:nth-child(3){animation-delay:.28s}
  @keyframes coinflip{0%{transform:rotateY(0) translateY(0)}50%{transform:rotateY(180deg) translateY(-16px)}100%{transform:rotateY(360deg) translateY(0)}}
  .deck{position:relative;width:74px;height:114px;}
  .deck .back{position:absolute;inset:0;border-radius:9px;border:1px solid var(--gold);
    background:repeating-linear-gradient(45deg,#2A1620,#2A1620 6px,#3A1D2A 6px,#3A1D2A 12px);
    box-shadow:0 6px 16px rgba(0,0,0,.55);animation:shuffle 1s ease-in-out infinite;}
  .deck .back:nth-child(2){animation-delay:.16s}.deck .back:nth-child(3){animation-delay:.32s}
  @keyframes shuffle{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(30px) rotate(9deg)}}
  .orb{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;
    color:var(--orb,#C9A227);border:1px solid var(--orb,#C9A227);
    background:radial-gradient(circle,rgba(255,255,255,.07),transparent 70%);animation:orbpulse 1.4s ease-in-out infinite;}
  @keyframes orbpulse{0%,100%{box-shadow:0 0 10px var(--orb,#C9A227);transform:scale(1)}50%{box-shadow:0 0 34px var(--orb,#C9A227);transform:scale(1.06)}}

  .reveal > *{animation:rise .6s ease both;}
  .reveal > *:nth-child(2){animation-delay:.12s}.reveal > *:nth-child(3){animation-delay:.24s}
  .reveal > *:nth-child(4){animation-delay:.36s}.reveal > *:nth-child(5){animation-delay:.48s}
  .reveal > *:nth-child(n+6){animation-delay:.6s}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  .tcard{width:92px;height:142px;border-radius:10px;border:1px solid var(--gold);position:relative;
    background:linear-gradient(160deg,#2B1621,#15101A 70%);box-shadow:0 8px 20px rgba(0,0,0,.5);
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 6px;text-align:center;
    animation:cardin .7s ease both;}
  .tcard:nth-child(2){animation-delay:.15s}.tcard:nth-child(3){animation-delay:.3s}
  @keyframes cardin{from{opacity:0;transform:rotateY(90deg)}to{opacity:1;transform:none}}
  .tcard .t-num{font-family:'Cinzel',serif;color:var(--gold);font-size:13px;position:absolute;top:7px;}
  .tcard .t-star{font-size:26px;color:#E8D48A;margin-bottom:6px;}
  .tcard .t-name{font-family:'Noto Serif TC',serif;font-size:15px;font-weight:700;color:var(--text);}
  .tcard .t-pos{position:absolute;bottom:7px;font-size:10px;color:var(--sub);letter-spacing:.08em;}
  .tcard.rev .t-star{transform:rotate(180deg);}
  .tcard.rev{border-color:#8B5A2B;}

  .smart-card.oracle{position:relative;border-color:rgba(201,162,39,.55);padding:18px 16px 14px;
    background:linear-gradient(170deg,#1C1813,#12101A 60%);box-shadow:0 0 0 1px rgba(201,162,39,.12) inset,0 10px 24px rgba(0,0,0,.35);}
  .smart-card.oracle .smart-title{text-align:center;font-size:14px;letter-spacing:.3em;}
  .smart-card.oracle .smart-text p{margin:0 0 10px;}
  .smart-card.oracle .smart-text p:last-child{margin-bottom:0;}
  .thinking::after{content:'';animation:dots 1.4s steps(4,end) infinite;}
  @keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
  .oracle-actions{display:flex;gap:8px;margin-top:12px;}
  .oracle-actions .btn{margin-top:0;}
  .chat-card{border-color:rgba(92,122,153,.45);}
  .chat-card .smart-title{color:#9DB7D1;font-size:14px;}
  .bubble-me{align-self:flex-end;max-width:85%;background:#2A2413;color:#F1E3B3;font-size:14px;padding:8px 11px;border-radius:12px 12px 2px 12px;}
  .bubble-sage{align-self:flex-start;max-width:92%;background:#0F0E17;color:var(--text);font-size:14px;line-height:1.7;
    padding:9px 11px;border-radius:12px 12px 12px 2px;border:1px solid var(--panel-border);}
  .bubble-note{font-size:12.5px;color:var(--sub);font-style:italic;}
  .bubble-err{font-size:12.5px;color:#D98C97;}
  .toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    background:#211F2B;color:var(--text);border:1px solid var(--gold);padding:9px 16px;border-radius:999px;font-size:13px;
    z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;}
  .toast.show{opacity:1;}
  @media (prefers-reduced-motion:reduce){
    .coin,.deck .back,.orb,.ritual-text,.tcard,.reveal > *{animation:none !important;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <div></div>
    <button class="lang-btn" id="lang-toggle">中文 / EN / ID</button>
  </div>

  <div class="hero">
    <div class="mark">D I V I N A T I O N</div>
    <h1>觀卜</h1>
    <p class="tagline" i18n="tagline">心裡有事，就來問一卦</p>
    <p i18n="subtitle">易經 · 塔羅 · 盧恩 · 每日運勢 · 紫微斗數</p>
    <div class="daily-quote" id="daily-quote"></div>
  </div>

  <div class="tabs">
    <div class="tab active" data-t="yijing" i18n="tab_yijing">易經</div>
    <div class="tab" data-t="tarot" i18n="tab_tarot">塔羅</div>
    <div class="tab" data-t="runes" i18n="tab_runes">符文</div>
    <div class="tab" data-t="daily" i18n="tab_daily">每日</div>
    <div class="tab" data-t="ziwei" i18n="tab_ziwei">紫微</div>
  </div>

  <!-- Yijing Panel -->
  <div class="panel active" id="panel-yijing">
    <div class="section-title cn" i18n="title_yijing">起卦問事</div>
    <div class="field">
      <label i18n="lbl_question">你想問什麼？</label>
      <input class="input" id="yijing-question" maxlength="120" placeholder="例：2027 年工作是否會有重大轉變？" i18n-ph="ph_yijing" />
      <div class="chips" data-chips="yijing" data-target="yijing-question"></div>
    </div>
    <button class="btn jade main-action" id="yijing-btn" i18n="btn_yijing">起卦</button>
    <div id="yijing-result"><div class="empty" i18n="empty_yijing">心中默想欲問之事<br/>按下起卦，以三枚銅錢法擲出六爻</div></div>
  </div>

  <!-- Tarot Panel -->
  <div class="panel" id="panel-tarot">
    <div class="section-title">MAJOR ARCANA</div>
    <div class="field"><label i18n="lbl_question_opt">問題（可留白）</label><input class="input" id="tarot-question" maxlength="120" placeholder="例：這件事接下來三個月的發展？" i18n-ph="ph_tarot" /><div class="chips" data-chips="tarot" data-target="tarot-question"></div></div>
    <div class="field"><label i18n="lbl_spread">牌陣</label><select class="select" id="tarot-mode"><option value="1" i18n="opt_t1">單張指引</option><option value="3" i18n="opt_t3">三張牌｜過去・現在・未來</option></select></div>
    <button class="btn crimson main-action" id="tarot-btn" i18n="btn_tarot">抽牌</button>
    <div id="tarot-result"><div class="empty" i18n="empty_tarot">靜心片刻<br/>抽牌看看此刻該留意什麼</div></div>
  </div>

  <!-- Runes Panel -->
  <div class="panel" id="panel-runes">
    <div class="section-title">ELDER FUTHARK</div>
    <div class="field"><label i18n="lbl_question_opt">問題（可留白）</label><input class="input" id="runes-question" maxlength="120" placeholder="例：我現在最需要注意什麼？" i18n-ph="ph_runes" /><div class="chips" data-chips="runes" data-target="runes-question"></div></div>
    <div class="field"><label i18n="lbl_spread">符文陣</label><select class="select" id="runes-mode"><option value="1" i18n="opt_r1">單枚指引</option><option value="3" i18n="opt_r3">三枚｜現況・阻力・建議</option></select></div>
    <button class="btn runic main-action" id="runes-btn" i18n="btn_runes">抽符文</button>
    <div id="runes-result"><div class="empty" i18n="empty_runes">伸手入符文袋中<br/>抽出符文，聆聽它的訊息</div></div>
  </div>

  <!-- Daily Panel -->
  <div class="panel" id="panel-daily">
    <div class="section-title cn" i18n="title_daily">今日運勢</div>
    <div class="field"><label i18n="lbl_birth">生日（選填）</label><input class="input" type="date" id="daily-birth" /></div>

const ROMAN = ['0','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI'];
const RESULT_ID = {yijing:'yijing-result',tarot:'tarot-result',runes:'runes-result',daily:'daily-result',ziwei:'ziwei-result'};

function renderExtras(){
  const L = dict[currentLang];
  const now = new Date();
  const dayNo = Math.floor((now - new Date(now.getFullYear(),0,0)) / 86400000);
  const q = L.quotes[dayNo % L.quotes.length];
  const dq = document.getElementById('daily-quote');
  if (dq) dq.innerHTML = `<b>${esc(L.quote_label)}</b>${esc(q)}`;
  document.querySelectorAll('.chips[data-chips]').forEach(box=>{
    const list = L['chips_'+box.dataset.chips] || [];
    box.innerHTML = list.map(t=>`<button type="button" class="chip">${esc(t)}</button>`).join('');
    box.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{
      const inp = document.getElementById(box.dataset.target);
      if (inp){ inp.value = ch.textContent; inp.focus(); }
    });
  });
}

function toast(msg){
  let t = document.getElementById('toast');
  if (!t){ t = document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._h); toast._h = setTimeout(()=>t.classList.remove('show'), 2200);
}

async function shareReading(question, text){
  const L = dict[currentLang];
  const url = location.href.split('#')[0];
  const full = `${L.share_head}\n${question ? '「'+question+'」\n' : ''}\n${text}\n\n${url}`;
  if (navigator.share){
    try { await navigator.share({ title: L.share_head, text: full }); return; }
    catch(e){ if (e && e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(full); toast(L.copied); }
  catch { toast(L.copy_fail); }
}

function ritualHTML(kind){
  const L = dict[currentLang];
  let art = '';
  if (kind==='yijing') art = '<div class="coins"><div class="coin"></div><div class="coin"></div><div class="coin"></div></div>';
  else if (kind==='tarot') art = '<div class="deck"><div class="back"></div><div class="back"></div><div class="back"></div></div>';
  else if (kind==='runes') art = '<div class="orb" style="--orb:#5C7A99">ᚨ</div>';
  else if (kind==='daily') art = '<div class="orb" style="--orb:#C9A227">☀</div>';
  else art = '<div class="orb" style="--orb:#6B4E8E">✦</div>';
  return `<div class="ritual">${art}<div class="ritual-text">${esc(L['rit_'+kind])}</div></div>`;
}

// 按下按鈕 → 先跑一小段儀式動畫 → 再顯示原本的結果（核心演算法完全不動）
function onRitual(btnId, kind, fn){
  const btn = document.getElementById(btnId);
  btn.addEventListener('click', ()=>{
    if (btn.disabled) return;
    const resEl = document.getElementById(RESULT_ID[kind]);
    if (kind==='ziwei' && (!document.getElementById('zw-date').value || !document.getElementById('zw-hour').value)) { fn(); return; }
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    btn.disabled = true;
    resEl.classList.remove('reveal');
    resEl.innerHTML = ritualHTML(kind);
    setTimeout(()=>{
      try { fn(); }
      finally {
        btn.disabled = false;
        void resEl.offsetWidth;
        resEl.classList.add('reveal');
      }
    }, reduce ? 250 : 1500);
  });
}

async function fillAiExplain(id, module, question, facts) {
  const el = document.getElementById(id);
  if (!el) return;
  const L = dict[currentLang];
  const head = `<div class="smart-title">— ${esc(L.ai_title)} —</div>`;
  try {
    const res = await fetch('/ask', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ module, question: question || '', facts, lang: currentLang }),
    });
    const data = await res.json().catch(() => null);
    if (!res.ok || !data?.ok || !data.explanation) throw new Error(data?.error || `HTTP ${res.status}`);
    const paras = String(data.explanation).split(/\n+/).map(t=>t.trim()).filter(Boolean).map(t=>`<p>${esc(t)}</p>`).join('');
    el.innerHTML = `${head}<div class="smart-text">${paras}</div><div class="oracle-actions"><button type="button" class="btn secondary small" data-act="share">${esc(L.share)}</button></div>`;
    el.querySelector('[data-act="share"]').onclick = () => shareReading(question, data.explanation);
  } catch (e) {
    el.innerHTML = `${head}<div class="smart-text" style="color:var(--sub);">${esc(L.ai_fail)}</div><div class="oracle-actions"><button type="button" class="btn secondary small" data-act="retry">${esc(L.retry)}</button></div>`;
    el.querySelector('[data-act="retry"]').onclick = () => {
      el.innerHTML = `${head}<div class="smart-text thinking" style="color:var(--sub);font-style:italic;">${esc(L.thinking)}</div>`;
      fillAiExplain(id, module, question, facts);
    };
  }
}

function attachChatSection(containerId, moduleName, question, facts) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const L = dict[currentLang];
  const chatBoxId = `chat-box-${Date.now()}`;
  const inputId = `chat-input-${Date.now()}`;
  const history = [];
  let busy = false;

  container.insertAdjacentHTML('beforeend', `
    <div class="smart-card chat-card">
      <div class="smart-title">💬 ${esc(L.ai_chat_title)}</div>
      <div class="chips" style="margin:0 0 10px;">
        <button type="button" class="chip" data-q="chat_q1">${esc(L.chat_q1)}</button>
        <button type="button" class="chip" data-q="chat_q2">${esc(L.chat_q2)}</button>
        <button type="button" class="chip" data-q="chat_q3">${esc(L.chat_q3)}</button>
      </div>
      <div id="${chatBoxId}-history" style="margin-bottom:10px; display:flex; flex-direction:column; gap:8px;"></div>
      <div style="display:flex; gap:6px;">
        <input class="input" id="${inputId}" maxlength="200" enterkeyhint="send" placeholder="${esc(L.chat_ph)}" style="font-size:14px;" />
        <button class="btn gold small" id="${chatBoxId}-send" style="width:auto; white-space:nowrap;">${esc(L.chat_send)}</button>
      </div>
      <div style="text-align:right;margin-top:6px;"><button type="button" class="chip" id="${chatBoxId}-clear">${esc(L.chat_clear)}</button></div>
    </div>`);

  const historyEl = document.getElementById(`${chatBoxId}-history`);
  const sendBtn = document.getElementById(`${chatBoxId}-send`);

  const sendMsg = async (msgText) => {
    if (!msgText || busy) return;
    busy = true; sendBtn.disabled = true;
    historyEl.insertAdjacentHTML('beforeend', `<div class="bubble-me">${esc(msgText)}</div>`);
    historyEl.insertAdjacentHTML('beforeend', `<div id="${chatBoxId}-temp" class="bubble-note thinking">${esc(L.thinking)}</div>`);
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ module: moduleName, question, facts, history, message: msgText, lang: currentLang })
      });
      const data = await res.json().catch(() => null);
      document.getElementById(`${chatBoxId}-temp`)?.remove();
      if (res.ok && data?.ok && data.reply) {
        historyEl.insertAdjacentHTML('beforeend', `<div class="bubble-sage">${esc(data.reply).replace(/\n+/g,'<br/>')}</div>`);
        history.push({ role: 'user', content: msgText });
        history.push({ role: 'assistant', content: data.reply });
      } else {
        historyEl.insertAdjacentHTML('beforeend', `<div class="bubble-err">${esc(L.chat_fail)}</div>`);
      }
    } catch (e) {
      document.getElementById(`${chatBoxId}-temp`)?.remove();
      historyEl.insertAdjacentHTML('beforeend', `<div class="bubble-err">${esc(L.net_fail)}</div>`);
    } finally {
      busy = false; sendBtn.disabled = false;
    }
  };

  const inputEl = document.getElementById(inputId);
  const sendFromInput = () => { const txt = inputEl.value.trim(); if (txt && !busy) { sendMsg(txt); inputEl.value = ''; } };
  sendBtn.onclick = sendFromInput;
  inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); sendFromInput(); } });

  document.getElementById(`${chatBoxId}-clear`).onclick = () => {
    history.length = 0; historyEl.innerHTML = ''; inputEl.value = '';
  };
  container.querySelectorAll(`.chat-card [data-q]`).forEach(b => b.onclick = () => sendMsg(L[b.dataset.q]));
}

onRitual('tarot-btn','tarot', ()=>{

const TRI_MATRIX = [[1,43,14,34,9,5,26,11],[10,58,38,54,61,60,41,19],[13,49,30,55,37,63,22,36],[25,17,21,51,42,3,27,24],[44,28,50,32,57,48,18,46],[6,47,64,40,59,29,4,7],[33,31,56,62,53,39,52,15],[12,45,35,16,20,8,23,2]];
function tossLine(){ let sum=0; for(let i=0;i<3;i++) sum += Math.random()<0.5?2:3; return sum; }
function trigramIndex(bits){ const key = bits.join(''); const map = {"111":0,"110":1,"101":2,"100":3,"011":4,"010":5,"001":6,"000":7}; return map[key]; }
function hexFromBits(bits){ const lowerIdx = trigramIndex(bits.slice(0,3)); const upperIdx = trigramIndex(bits.slice(3,6)); return TRI_MATRIX[upperIdx][lowerIdx]; }
function lineLabel(i){ return ["初爻","二爻","三爻","四爻","五爻","上爻"][i]; }

onRitual('yijing-btn','yijing', ()=>{
  const question = document.getElementById('yijing-question').value.trim();
  const lines = [];
  for(let i=0;i<6;i++) lines.push(tossLine());

  const bits = lines.map(v => (v===7||v===9)?1:0);
  const changedBits = lines.map((v,i)=> (v===6||v===9) ? 1-bits[i] : bits[i]);
  const hexNum = hexFromBits(bits);
  const changedNum = hexFromBits(changedBits);
  const moving = lines.map((v,i)=>(v===6||v===9)?i:-1).filter(i=>i>=0);

  function renderHex(vals, title, num, changedView=false){
    let h = `<div class="hex-box"><div class="section-title cn">${title}</div><div class="hexagram">`;
    vals.forEach((v,i)=>{
      const solid = changedView ? !!changedBits[i] : (v===7||v===9);
      const changing = !changedView && (v===6||v===9);
      h += `<div class="line ${solid?'solid':'broken'} ${changing?'changing':''}"><div class="bar"></div>${solid?'':'<div class="bar"></div>'}</div>`;
    });
    h += `</div><div class="result-name">${HEX_NAMES[num]}卦</div></div>`;
    return h;
  }

  let html = question ? `<div class="question-echo">「${esc(question)}」</div>` : '';
  html += `<div class="hex-pair">${renderHex(lines, dict[currentLang].hex_orig, hexNum)}${renderHex(lines, dict[currentLang].hex_change, changedNum, true)}</div>`;
  html += `<div class="meta-card">`;
  html += `<div class="meta-row"><span>${dict[currentLang].label_now}</span><strong>${HEX_NAMES[hexNum]}｜${HEX_TEXT[hexNum]}</strong></div>`;
  html += `<div class="meta-row"><span>${dict[currentLang].label_moving}</span><strong class="moving">${moving.length?moving.map(lineLabel).join('、'):dict[currentLang].label_none}</strong></div>`;
  html += `<div class="meta-row"><span>${dict[currentLang].label_after}</span><strong>${HEX_NAMES[changedNum]}｜${HEX_TEXT[changedNum]}</strong></div>`;
  html += `</div>`;

  const aiHex = aiCardPlaceholder(dict[currentLang].ai_title);
  html += aiHex.html;

  const resContainer = document.getElementById('yijing-result');
  resContainer.innerHTML = html;

  const facts = { PresentHexagram: HEX_NAMES[hexNum], PresentMeaning: HEX_TEXT[hexNum], FutureHexagram: HEX_NAMES[changedNum], FutureMeaning: HEX_TEXT[changedNum], MovingLines: moving.length ? moving.map(lineLabel) : 'None' };
  fillAiExplain(aiHex.id, 'yijing', question, facts);
  attachChatSection('yijing-result', 'yijing', question, facts);
});

function getChineseCalendarParts(dateVal, timeVal){
  const [y,m,d] = dateVal.split('-').map(Number);
  const [hh,mm] = timeVal.split(':').map(Number);
  const dt = new Date(y,m-1,d,hh,mm||0);
  const parts = new Intl.DateTimeFormat('zh-Hant-u-ca-chinese',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(dt);
  const monthPart=parts.find(p=>p.type==='month')?.value||'';
  const dayPart=parts.find(p=>p.type==='day')?.value||'';
  const yearPart=parts.find(p=>p.type==='relatedYear')?.value||'';
  const cnNum=(t)=>{ const d=t.match(/\d+/); if(d) return Number(d[0]);
    const m=t.replace(/[閏闰月日初]/g,''); const map={'正':1,'冬':11,'臘':12,'腊':12,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'十一':11,'十二':12};
    if(map[m]) return map[m]; const g=m.match(/^([二三])?十([一二三四五六七八九])?$/);
    if(g) return (g[1]?map[g[1]]:1)*10+(g[2]?map[g[2]]:0); if(m==='廿') return 20; if(m.startsWith('廿')) return 20+(map[m.slice(1)]||0); return 0; };
  const mn=cnNum(monthPart), dn=cnNum(dayPart);
  if(!mn||!dn) throw new Error('Chinese calendar conversion unavailable');
  return {lunarYear:Number(yearPart)||y,lunarMonth:mn,lunarDay:dn};
}
function earthlyBranchIndexForHour(hour){ return Math.floor(((hour+1)%24)/2); }
function mod12(n){ return (n%12+12)%12; }

  '乙':{'子':'火六局','丑':'火六局','寅':'土五局','卯':'土五局','辰':'金四局','巳':'金四局','午':'木三局','未':'木三局','申':'水二局','酉':'水二局','戌':'土五局','亥':'土五局'},

function yearStemIndex(lunarYear){ return (lunarYear-4+10)%10; }
function stemAtLunarMonth(yearStemIdx,lunarMonth){ return ([2,2,4,4,6,6,8,8,0,0][yearStemIdx]+lunarMonth-1)%10; }
function buildZiweiFramework(dateVal,timeVal,gender){
  const [hour]=timeVal.split(':').map(Number), lunar=getChineseCalendarParts(dateVal,timeVal);
  const yearStemIdx=yearStemIndex(lunar.lunarYear), yearStem=ZW_STEMS[yearStemIdx], yearBranch=ZW_BRANCHES[mod12(lunar.lunarYear-4)];
  const hourBranch=earthlyBranchIndexForHour(hour), monthBranch=mod12(2+lunar.lunarMonth-1), monthStemIdx=stemAtLunarMonth(yearStemIdx,lunar.lunarMonth);
  const lifeBranch=mod12(monthBranch-hourBranch), bodyBranch=mod12(monthBranch+hourBranch);
  const yinStemIdx=[2,4,6,8,0][yearStemIdx%5]; // 五虎遁：甲己丙寅、乙庚戊寅、丙辛庚寅、丁壬壬寅、戊癸甲寅
  const lifeStemIdx=(yinStemIdx+mod12(lifeBranch-2))%10, lifeStem=ZW_STEMS[lifeStemIdx];
  const bureau=ZW_BUREAU_BY_STEM_BRANCH[ZW_STEMS[yearStemIdx%5]]?.[ZW_BRANCHES[lifeBranch]]; // 甲己、乙庚、丙辛、丁壬、戊癸同一組
  if(!bureau) throw new Error('Five-element bureau unavailable for this chart');
  const bureauNum={'二':2,'三':3,'四':4,'五':5,'六':6}[bureau.charAt(1)]||0; // 「水二局」→ 2
  const naYin=ZW_NA_YIN[lifeStem+ZW_BRANCHES[lifeBranch]]||'';
  const palaceCells=ZW_BRANCHES.map((branch,i)=>({branch,palace:ZW_PALACES[mod12(lifeBranch-i)],stars:[],transforms:[],stem:ZW_STEMS[(yinStemIdx+mod12(i-2))%10]}));
  const put=(star,idx)=>palaceCells[mod12(idx)].stars.push(star);
  const purpleByBureau={
    2:['丑','寅','寅','卯','卯','辰','辰','巳','巳','午','午','未','未','申','申','酉','酉','戌','戌','亥','亥','子','子','丑','丑','寅','寅','卯','卯','辰'],
    3:['辰','丑','寅','巳','寅','卯','午','卯','辰','未','辰','巳','申','巳','午','戌','午','未','戌','未','申','亥','申','酉','子','酉','戌','丑','戌','亥'],
    4:['亥','辰','丑','寅','子','巳','寅','卯','丑','午','卯','辰','寅','未','辰','巳','卯','申','巳','午','辰','酉','午','未','巳','戌','未','申','午','亥'],
    5:['午','亥','辰','丑','寅','未','子','巳','寅','卯','申','丑','午','卯','辰','酉','寅','未','辰','巳','戌','卯','申','巳','午','亥','辰','酉','午','未'],
    6:['酉','午','亥','辰','丑','寅','戌','未','子','巳','寅','卯','亥','申','丑','午','卯','辰','子','酉','寅','未','辰','巳','丑','戌','卯','申','巳','午']
  };
  const purpleBranch=purpleByBureau[bureauNum]?.[lunar.lunarDay-1];
  if(!purpleBranch) throw new Error('Lunar day outside supported 1–30 range');
  const purpleIdx=ZW_BRANCHES.indexOf(purpleBranch);
  put('紫微',purpleIdx);
  [['天機',-1],['太陽',-3],['武曲',-4],['天同',-5],['廉貞',-8]].forEach(([star,off])=>put(star,purpleIdx+off));
  const tianfuMirror={0:4,1:3,2:2,3:1,4:0,5:11,6:10,7:9,8:8,9:7,10:6,11:5};
  const tianfuIdx=tianfuMirror[purpleIdx];
  [['天府',0],['太陰',1],['貪狼',2],['巨門',3],['天相',4],['天梁',5],['七殺',6],['破軍',10]].forEach(([star,off])=>put(star,tianfuIdx+off));
  const four=ZW_FOUR_TRANSFORMS[yearStem]||[];
  four.forEach(([star,mark])=>{const cell=palaceCells.find(c=>c.stars.includes(star)); if(cell) cell.transforms.push(mark);});
  const isYangYear=yearStemIdx%2===0, forward=(gender==='M')===isYangYear;
  const _t=new Date(), _today=_t.getFullYear()+'-'+String(_t.getMonth()+1).padStart(2,'0')+'-'+String(_t.getDate()).padStart(2,'0');
  let ageNow; try{ ageNow=getChineseCalendarParts(_today,'12:00').lunarYear-lunar.lunarYear+1; }catch{ ageNow=_t.getFullYear()-Number(dateVal.slice(0,4))+1; }
  const currentIndex=Math.max(0,Math.min(11,Math.floor(Math.max(0,ageNow-bureauNum)/10)));
  const daxian=Array.from({length:12},(_,i)=>{const idx=mod12(lifeBranch+(forward?i:-i));return {ageStart:bureauNum+i*10,ageEnd:bureauNum+i*10+9,palace:palaceCells[idx].palace,branch:ZW_BRANCHES[idx],index:idx};});
  return {lunar,yearStem,yearBranch,yearStemIdx,hourBranch,lifeBranch,bodyBranch,lifeStem,bureau,bureauNum,naYin,palaceCells,four,forward,daxian,currentIndex,ageNow};
}

    html+='<div class="zw-center"><div class="zw-c-title">'+dict[currentLang].zw_center_title+'</div><div class="zw-c-line">'+dict[currentLang].zw_life+'：'+ZW_BRANCHES[c.lifeBranch]+'　'+dict[currentLang].zw_body+'：'+ZW_BRANCHES[c.bodyBranch]+'<br/>'+dict[currentLang].zw_year+'：'+c.yearStem+c.yearBranch+'　'+dict[currentLang].zw_nayin+'：'+c.naYin+dict[currentLang].zw_element_suffix+'<br/>'+dict[currentLang].zw_direction+'：'+(c.forward?dict[currentLang].zw_forward:dict[currentLang].zw_backward)+'</div></div></div>';
    html+='<div class="meta-card"><div class="meta-row"><span>'+dict[currentLang].zw_four+'</span><strong>'+c.four.map(x=>x[0]+'化'+x[1]).join('　')+'</strong></div><div class="meta-row"><span>'+dict[currentLang].zw_current_daxian+'</span><strong>'+cur.ageStart+'–'+cur.ageEnd+'歲｜'+cur.palace+'｜'+cur.branch+'</strong></div></div>';
    html+='<div class="hint">'+dict[currentLang].zw_v3_hint+'</div>'+ai.html;
    resultEl.innerHTML=html;
    const facts={BirthDate:dateVal,BirthTime:timeVal,Gender:genderLabel,LunarDate:c.lunar.lunarYear+'-'+c.lunar.lunarMonth+'-'+c.lunar.lunarDay,YearPillar:c.yearStem+c.yearBranch,HourBranch:ZW_BRANCHES[c.hourBranch],LifePalace:ZW_BRANCHES[c.lifeBranch],BodyPalace:ZW_BRANCHES[c.bodyBranch],LifeStem:c.lifeStem,Bureau:c.bureau,MainStars:c.palaceCells.map(x=>x.palace+':'+(x.stars.join('、')||'空宮')),FourTransformations:c.four.map(x=>x[0]+'化'+x[1]),CurrentDecadal:cur.ageStart+'-'+cur.ageEnd+'歲 '+cur.palace,ChartStatus:'v3.0 14-main-star framework + four transformations + decadal cycle'};
    fillAiExplain(ai.id,'ziwei','',facts); attachChatSection('ziwei-result','ziwei','Zi Wei Chart Analysis',facts);
  }catch(e){resultEl.innerHTML='<div class="empty">'+esc(e.message||'Chart calculation failed')+'</div>';}
});
